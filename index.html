<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="엑셀·CSV로 단어와 문제를 올려 4지선다로 외우는 학습 웹앱">
<meta name="theme-color" content="#5a5be0">
<title>amgiBBang · 암기빵</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍞%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel-2:#fbfbfe;
  --ink:#1b1c26; --muted:#6a6c7d; --faint:#9a9cad;
  --line:#e9eaf1; --line-2:#dfe0ea;
  --accent:#5a5be0; --accent-soft:#ececfb; --accent-ink:#4344c9;
  --good:#1f9d62; --good-soft:#e5f5ec;
  --bad:#e0403f; --bad-soft:#fceceb;
  --star:#f4b740;
  --shadow:0 1px 2px rgba(24,25,45,.05),0 8px 26px rgba(24,25,45,.06);
  --shadow-lg:0 12px 44px rgba(24,25,45,.14);
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131319; --panel:#1d1e26; --panel-2:#232430;
    --ink:#ecedf4; --muted:#a2a4b6; --faint:#71738a;
    --line:#2b2c39; --line-2:#353747;
    --accent:#8a8bf2; --accent-soft:#26263a; --accent-ink:#b9b9fb;
    --good:#3fbd7e; --good-soft:#17301f;
    --bad:#f0605f; --bad-soft:#331919;
    --star:#f5c25b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 16px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#131319; --panel:#1d1e26; --panel-2:#232430;
  --ink:#ecedf4; --muted:#a2a4b6; --faint:#71738a;
  --line:#2b2c39; --line-2:#353747;
  --accent:#8a8bf2; --accent-soft:#26263a; --accent-ink:#b9b9fb;
  --good:#3fbd7e; --good-soft:#17301f;
  --bad:#f0605f; --bad-soft:#331919;
  --star:#f5c25b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 16px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{overflow-x:clip}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5;
  min-height:100vh;
}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
::selection{background:var(--accent-soft)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .row{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;letter-spacing:-.01em}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.brand small{font-weight:700;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.icon-btn:hover{background:var(--panel);border-color:var(--line);color:var(--ink)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-width:0}
.crumb button{color:var(--muted);font-weight:600}
.crumb button:hover{color:var(--ink)}
.crumb .cur{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--faint)}

/* ---------- generic ---------- */
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:34px 0 16px}
.section-head h2{font-size:20px;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:10px 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);transition:transform .06s,background .15s,border-color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--panel)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* ---------- home: category cards ---------- */
.grid{display:grid;gap:14px}
.cat-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cat-card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);transition:transform .12s,border-color .15s;overflow:hidden}
.cat-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.cat-card .emoji{font-size:26px;line-height:1;filter:saturate(1.05)}
.cat-card h3{font-size:18px;margin-top:14px;letter-spacing:-.01em}
.cat-card .meta{margin-top:6px;color:var(--muted);font-size:13px}
.cat-card .bar{margin-top:16px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.cat-card .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cat-card .del{position:absolute;top:12px;right:12px;opacity:0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.cat-card:hover .del{opacity:1}
.cat-card .del:hover{background:var(--bad-soft);color:var(--bad)}
.add-card{border:1.5px dashed var(--line-2);background:transparent;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);min-height:150px;font-weight:700}
.add-card:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--panel-2)}
.add-card .plus{font-size:26px;line-height:1;font-weight:400}

/* ---------- deck rows ---------- */
.deck{display:flex;align-items:center;gap:16px;text-align:left;width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;box-shadow:var(--shadow);transition:border-color .15s,transform .1s}
.deck:hover{border-color:var(--accent);transform:translateY(-2px)}
.deck .kind{flex:none;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.02em}
.kind.vocab{background:var(--accent-soft);color:var(--accent-ink)}
.kind.quiz{background:var(--good-soft);color:var(--good)}
.deck .info{flex:1;min-width:0}
.deck .info h3{font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .info .sub{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.deck .info .sub .mono{color:var(--faint)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.deck .go{flex:none;color:var(--faint)}
.deck-actions{flex:none;display:flex;gap:4px}
.deck-actions .icon-btn{width:34px;height:34px}
.mini-bar{flex:none;width:74px}
.mini-bar .t{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mini-bar .t i{display:block;height:100%;background:var(--good);border-radius:99px}
.mini-bar .n{font-size:10px;color:var(--faint);text-align:right;margin-top:4px}

.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .big{font-size:34px}
.empty h3{margin:12px 0 6px;color:var(--ink)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,20,35,.5);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.modal{width:100%;max-width:600px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden;margin:auto}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal header h3{font-size:16px}
.modal .body{padding:20px}
.modal .foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--line);background:var(--panel-2)}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}
.field .hint{color:var(--muted);font-weight:400;font-size:12px;margin-top:5px;line-height:1.55}
input[type=text],input[type=password],input[type=email],input[type=number]{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel-2);color:var(--ink);font-size:14px;font-family:inherit}
textarea{width:100%;min-height:150px;padding:12px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel-2);color:var(--ink);font-size:13px;font-family:"JetBrains Mono",monospace;line-height:1.6;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);padding:4px;border-radius:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--accent-ink);box-shadow:var(--shadow)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:0 0 10px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.parsebox{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.parsebox.ok{background:var(--good-soft);color:var(--good)}
.parsebox.warn{background:var(--bad-soft);color:var(--bad)}
.parsebox.idle{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.chip-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.link{color:var(--accent-ink);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:2px}

/* ---------- QUIZ PLAYER ---------- */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.p-top{height:60px;display:flex;align-items:center;gap:16px;padding:0 20px}
.progressline{position:absolute;left:0;right:0;top:0;height:4px;background:var(--line)}
.progressline i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
.p-count{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;letter-spacing:.02em}
.p-count b{color:var(--accent-ink)}
.p-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 20px 8px;min-height:0}
.card{width:100%;max-width:680px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:44px 32px;min-height:min(46vh,360px);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center}
.card .star{position:absolute;top:18px;left:18px;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--faint);font-size:20px}
.card .star:hover{background:var(--panel-2);color:var(--star)}
.card .star.on{color:var(--star)}
.card .qtag{position:absolute;top:22px;right:22px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint);letter-spacing:.08em}
.prompt-word{font-size:clamp(32px,6vw,54px);font-weight:900;letter-spacing:-.02em;line-height:1.15}
.prompt-q{font-size:clamp(19px,3.2vw,25px);font-weight:700;letter-spacing:-.01em;line-height:1.4;max-width:38ch}
.prompt-sub{margin-top:14px;color:var(--faint);font-size:13px;font-family:"JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.p-choices{padding:8px 20px 10px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:720px;margin:0 auto;width:100%}
.p-choices.stack{grid-template-columns:1fr}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:16px 18px;font-size:15px;font-weight:600;line-height:1.35;transition:border-color .12s,background .12s,transform .06s;box-shadow:var(--shadow)}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.choice .idx{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;color:var(--muted)}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .idx{background:var(--good);color:#fff;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .idx{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice:disabled{cursor:default}
.choice.dim{opacity:.5}
.p-bottom{padding:6px 20px 22px;display:flex;justify-content:center}
.dunno{color:var(--faint);font-weight:700;font-size:14px;padding:10px 18px;border-radius:10px}
.dunno:hover{color:var(--muted);background:var(--panel)}
.dunno .mono{font-size:12px}

/* result */
.result{width:100%;max-width:560px;margin:auto;text-align:center;padding:20px}
.ring{width:150px;height:150px;margin:6px auto 18px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-size:38px;font-weight:900;font-family:"JetBrains Mono",monospace;letter-spacing:-.02em}
.ring .pct span{font-size:12px;color:var(--muted);font-weight:700}
.result h2{font-size:24px;margin-bottom:6px}
.result .tally{color:var(--muted);margin-bottom:22px}
.result .tally b{color:var(--ink)}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.review{text-align:left;border-top:1px solid var(--line);padding-top:18px}
.review h4{font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:700}
.rev-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px}
.rev-item .rq{font-weight:700;font-size:14px;margin-bottom:7px}
.rev-item .ra{font-size:13px;display:flex;gap:7px;align-items:baseline}
.rev-item .ra .tag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;flex:none;letter-spacing:.03em}
.tag.g{background:var(--good-soft);color:var(--good)}
.tag.r{background:var(--bad-soft);color:var(--bad)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){
  .p-choices{grid-template-columns:1fr}
  .card{padding:34px 20px}
  .section-head{margin-top:26px}
  /* compact top bar so brand + breadcrumb + account fit 375px */
  .topbar .row{gap:8px}
  .crumb{overflow:hidden;flex:1 1 auto}
  .brand{font-size:15px}
  .brand small{display:none}
  .crumb .cur{max-width:30vw}
}
.hide{display:none!important}

/* ---------- answer editor ---------- */
.ae-body{max-height:min(64vh,560px);overflow:auto}
.ae-info{position:sticky;top:0;z-index:2;margin-bottom:14px}
.ae-q{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;background:var(--panel)}
.ae-q.need{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.ae-stem{display:flex;gap:9px;align-items:flex-start;font-weight:700;font-size:14px;line-height:1.5;margin-bottom:10px}
.ae-num{flex:none;min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.ae-badge{flex:none;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad);letter-spacing:.02em}
.ae-choices{display:grid;gap:7px}
.ae-choice{display:flex;align-items:center;gap:11px;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;line-height:1.35}
.ae-choice:hover{border-color:var(--accent)}
.ae-choice .idx{flex:none;width:22px;height:22px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.ae-choice.sel{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ae-choice.sel .idx{background:var(--good);color:#fff;border-color:var(--good)}

/* ---------- vocab editor ---------- */
.ve-body{max-height:min(64vh,560px);overflow:auto}
.ve-head{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:2px 2px 10px}
.ve-head span{opacity:.6}
.ve-count{margin-left:auto;color:var(--muted)}
.ve-list{display:flex;flex-direction:column;gap:8px}
.ve-row{display:flex;gap:8px;align-items:center}
.ve-row .ve-q{flex:0 0 34%;min-width:0}
.ve-row .ve-a{flex:1;min-width:0}
.ve-row input{padding:9px 11px;font-size:13.5px}
.ve-del{flex:none;width:34px;height:34px;border-radius:8px;color:var(--faint);display:grid;place-items:center;font-size:14px;background:transparent}
.ve-del:hover{background:var(--bad-soft);color:var(--bad)}

/* ---------- login gate ---------- */
.gate{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:20px 0 48px}
.gate-card{width:100%;max-width:420px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:38px 30px}
.gate-logo{font-size:52px;line-height:1}
.gate-card h1{font-size:27px;margin-top:12px;letter-spacing:-.02em}
.gate-card h1 span{color:var(--muted);font-weight:700;font-size:18px}
.gate-sub{color:var(--muted);font-size:14px;line-height:1.6;margin:12px 0 22px}
.gate-form{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.gate-form input{width:100%;padding:13px 14px;text-align:center;font-size:15px}
.gate-form .btn{width:100%;justify-content:center;padding:13px}
.gate-toggle-wrap{margin-top:12px}
.gate-toggle{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);background:transparent;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s}
.gate-toggle:hover{background:var(--panel-2);border-color:var(--line-2);color:var(--accent-ink)}
.gate-toggle:active{transform:translateY(1px)}
.pw-hero{text-align:center;margin:-2px 0 18px}
.pw-lock{font-size:34px;line-height:1;margin-bottom:8px}
.pw-hero p{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0}

/* ---------- my page (stats) ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:4px}
.stat-tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stat-tile .sv{font-size:26px;font-weight:900;letter-spacing:-.02em}
.stat-tile .sl{color:var(--muted);font-size:13px;font-weight:700;margin-top:2px}
.stat-tile .ss{color:var(--faint);font-size:11px;margin-top:4px}
.stat-list{display:flex;flex-direction:column;gap:8px}
.stat-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow)}
.sr-emoji{flex:none;font-size:20px}
.sr-info{flex:1;min-width:0;display:flex;flex-direction:column}
.sr-info b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-sub{color:var(--muted);font-size:12px;margin-top:2px}
.sr-bar{flex:none;width:72px}
.sr-bar .t{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.sr-bar .t i{display:block;height:100%;background:var(--good);border-radius:99px}
.sr-pct{flex:none;font-size:13px;font-weight:800;min-width:38px;text-align:right}
.sr-pct.g{color:var(--good)} .sr-pct.r{color:var(--bad)}
.me-empty{color:var(--muted);text-align:center;padding:22px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;font-size:13px}

/* ---------- emoji picker ---------- */
.emoji-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.emoji-preview{font-size:24px;width:44px;height:44px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;flex:none}
.emoji-head input{flex:1}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;max-height:180px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.emoji-opt{font-size:22px;height:40px;border-radius:8px;display:grid;place-items:center;background:transparent}
.emoji-opt:hover{background:var(--panel)}
.emoji-opt.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}

/* labeled exit button in the quiz player */
.quit-btn{width:auto;display:inline-flex;align-items:center;padding:0 12px 0 10px;gap:6px;border:1px solid var(--line);background:var(--panel)}
.quit-btn span{font-size:13px;font-weight:700}
.quit-btn:hover{border-color:var(--bad);color:var(--bad)}

/* ---------- quit confirm (inside player) ---------- */
.p-confirm{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb,var(--bg) 68%,transparent);backdrop-filter:blur(6px)}
.p-confirm-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:26px 24px;text-align:center}
.p-confirm-card h3{font-size:19px;margin-bottom:8px}
.p-confirm-card p{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 20px}
.p-confirm-card .row{display:flex;gap:10px}
.p-confirm-card .row .btn{flex:1;justify-content:center}

/* ---------- auth / sync ---------- */
.authbox{display:flex;align-items:center;gap:8px}
.authbox .acct-email{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth-off{font-size:11px;color:var(--faint);letter-spacing:.04em}
.dot-sync{width:8px;height:8px;border-radius:99px;flex:none;background:var(--faint);transition:background .2s}
.dot-sync.ok{background:var(--good)}
.dot-sync.busy{background:var(--star);animation:pulse 1s ease-in-out infinite}
.dot-sync.err{background:var(--bad)}
.dot-sync.off{background:var(--faint)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* mobile auth overrides — placed after the base auth rules so they win */
@media (max-width:600px){
  .authbox .acct-email{max-width:56px}
  .authbox .btn.sm{padding:6px 9px}
}

</div>

<main class="wrap" id="view"></main>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================
   amgiBBang (암기빵)  ·  single-file study quiz app
   data persisted to localStorage (this browser only)
========================================================= */
const LS_KEY = "amgi.db.v3";
const $ = (s,el=document)=>el.querySelector(s);
const uid = ()=> Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------------- seed content (from 도균's own files) ---------------- */
function seedDB(){
  const toeicWords = [
    ["scheme","계획, 제도"],["janitor","문지기, 관리인"],["appointment","약속, 예약"],
    ["responsible","~에 대한 책임이 있는"],["warehouse","창고"],["invoice","청구서, 송장"],
    ["refund","환불(하다)"],["merger","합병"],["tenant","세입자, 임차인"],
    ["itinerary","여행 일정표"],["reimburse","배상하다, 상환하다"],["vacancy","결원, 공석"],
    ["mandatory","의무적인, 필수의"],["prospective","장래의, 유망한"],["subsidiary","자회사"],
    ["prompt","신속한; 촉진하다"]
  ];
  const review = [
    ["The fan cowl doors are opened by:",["Hold open rods.","Spring actuators.","Load share grooves.","The PDOS."],3],
    ["The forward lower engine mount attaches to the engine's:",["Intermediate case.","Fan case.","Thrust reverser doors.","Exhaust case."],0],
    ["Pamb sensors are found on the:",["Fan cowl doors.","Strut.","Thrust reverser doors.","Inlet cowl.","Exhaust case."],0],
    ["The seal drain tubes drain fuel and oil from engine components overboard through the:",["Exhaust nozzle.","The opening in the thrust reverser doors at the 6:00 position.","Fan case.","Exhaust plug."],1],
    ["The engine station numbering system is used to:",["Standardize.","Abbreviate terms.","Find points in the gaspath.","Find points on the engine cases."],2],
    ["Rotational energy for the main gearbox is received from the:",["Front of the N1 rotor.","Rear of the low compressor.","Front of the N2 compressor.","Rear of the high compressor."],2],
    ["The number of stages in the low and high pressure compressor sections are:",["LPC: 3 stages; HPC: 9 stages.","LPC: 5 stages; HPC: 17 stages.","LPC: 7 stages; HPC: 11 stages.","LPC: 10 stages; HPC: 8 stages."],2],
    ["The high compressor rotor comprises:",["11 disks bolted together.","8 major components.","14 stages.","Vanes and blades."],0],
    ["The combustion chamber is a:",["Two-piece floatwall annular design.","One-piece annular design.","Multi-can annular design.","All of the above."],0],
    ["The purpose of the angle gearbox is to:",["Drive the starter.","Give horsepower for the aircraft.","Power the aircraft hydraulic system.","Drive the main gearbox."],3],
    ["The number of stages in the high pressure turbine is:",["1.","2.","3.","4."],1],
    ["The EEC data entry plug:",["Is matched to the EEC.","Is matched to the engine.","Has the engine serial number stamped on it.","Increases indicated oil pressure at a constant N2."],1],
    ["The EEC gives limit protection (fuel topping) for:",["N1, N2, and PB","N1, N2, and EGT","N1, PB, and EGT","N2, PB, and EGT"],0],
    ["The EEC normally operates in the:",["N1 mode.","N2 mode.","EPR mode.","EGT mode."],2],
    ["For split ship transportability, the EEC programming plug can be secured to a connector mounted to the:",["Diffuser case.","Exhaust case.","Left side of the gearbox.","Inlet cowl."],0],
    ["The fuel heat system:",["Uses P3 to heat the fuel.","Uses P4 to heat the fuel.","Must be ON for all takeoffs and landings.","Is an automatic system whereby heat is transferred from the engine oil system."],3],
    ["The servo fuel heater will:",["Heat metered fuel to the injectors.","Cool engine oil for the gearbox.","Prevent ice from contaminating torque motors and servos in the components.","Measure Tfuel."],2],
    ["Before and during initial engine start, the:",["2.5 bleed valve should be closed.","2.9 bleed valves should be closed.","2.5 bleed valve should be open and the 2.9 bleed valves should be open.","2.5 bleed valve should be closed and the 2.9 bleed valves should be open."],2],
    ["With the engine shutdown, the stator vane actuator is in the open position. This condition:",["Is normal on the PW4090 engine.","Indicates the fuel metering unit is defective.","Requires replacement of the stator vane actuator.","Could be caused by improper rigging of the unison rings."],0],
    ["The 2.9 bleed valves are:",["Opened by spring load and closed by Ps3.","Opened by Ps3 and closed by spring load.","Opened by Ps3 and closed by 9th stage air.","Opened by 6th stage air and closed by Ps3."],0],
    ["With the engine shutdown, the 2.5 bleed valve actuator piston rod should be in the:",["Aft position; the 2.5 bleed valve should be open.","Aft position; the 2.5 bleed valve should be closed.","Forward position; the 2.5 bleed valve should be open.","Forward position; the 2.5 bleed valve should be closed."],2],
    ["Stator vane actuator rigging is checked with the actuator position(s):",["Full open.","Full closed.","Full open and full closed.","Full open (+6 degree) and full closed."],0],
    ["Visual position indicators can be found on the:",["2.9 bleed valves.","2.9 bleed valve solenoids.","2.5 and stator vane actuators.","TVBC air valves."],3],
    ["TVBC air valves A, B, and C are:",["Open only during cruise.","Open only during takeoff.","Spring-loaded open and pneumatically closed.","Spring-loaded closed and pneumatically opened."],2],
    ["The primary input(s) used for control of the TVBC air valves is the:",["Altitude, N2 and HPT 2nd stage vane internal cavity temperature.","Thrust lever angle.","Reverser position.","EGT."],0],
    ["The stage air used for turbine vane and blade cooling is:",["6th.","9th.","12th.","15th."],2],
    ["The LPT/TBV system is used to reduce axial loads on the:",["Main gearbox.","No. 1 bearing.","Reverser position.","EGT probe."],1]
  ];
  const oil = [
    ["In cruise, the primary coolant of IDG oil is:",["2.5 air.","Fan air.","Engine oil.","Engine fuel."],1],
    ["At idle on ground, the typical position for valves on the IDG air/oil heat exchanger is:",["Closed.","Open.","Bypassed.","None of the above."],1],
    ["If a main AC bus loses power, the backup power system supplies power to the related transfer bus.",["True","False"],0],
    ["The backup generator inlet oil temperature is regulated at:",["93.3°C.","98.6°C.","121.0°C.","127.0°C."],0],
    ["If a fire should occur, the EEC will schedule the backup generator air/oil heat exchanger valve to:",["Partially open.","Partially closed.","Fully open.","Fully closed."],3],
    ["To cool backup generator oil, the backup generator system uses:",["Engine oil.","Engine fuel.","Fan air.","Fan air and 2.5 bleed air."],2]
  ];
  const starting = [
    ["28 VDC starter solenoid power is controlled by an electronic relay found in the:",["Starter air valve.","Engine relay unit.","Supplemental control unit.","Backup generator."],1],
    ["Starter cutout is automatic when engine N2 speed reaches:",["Idle N2.","30% N2.","45% N2.","Overspeed."],2],
    ["For starter-assisted inflight starts, the starter air valve solenoid:",["Pulses to modulate airflow to the starter.","Magnetically locks closed.","Magnetically locks open.","Does none of the above."],0]
  ];
  const vDeck = (name,words)=>({id:uid(),name,type:"vocab",created:Date.now(),
    items:words.map(w=>({q:w[0],a:w[1]})),fav:[],wrong:[],best:null});
  const qDeck = (name,rows)=>({id:uid(),name,type:"quiz",created:Date.now(),
    items:rows.map(r=>({q:r[0],choices:r[1],answer:r[2]})),fav:[],wrong:[],best:null});
  return { cats:[
    {id:uid(),name:"토익",emoji:"📘",decks:[ vDeck("샘플 단어장 (스크린샷 단어 포함)",toeicWords) ]},
    {id:uid(),name:"항공",emoji:"✈️",decks:[
      qDeck("PW4090 리뷰 문제 (교안)",review),

/* ---------------- persistence ---------------- */
let DB;
function load(){ try{const r=localStorage.getItem(LS_KEY);if(r)return JSON.parse(r);}catch(e){} return null; }
function persistLocal(){ try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){ toast("저장 공간이 가득 찼어요"); } }
// save() = local cache write + (if signed in) debounced cloud sync
function save(){ persistLocal(); scheduleSync(); }
// each account is its own space — start empty, no shared sample/dummy data.
// (seedDB() is kept above only as an optional "load samples" source, not auto-used.)
DB = load() || {cats:[]};

/* ---------------- routing / state ---------------- */
let route = {view:"home", catId:null, deckId:null};
const findCat = id => DB.cats.find(c=>c.id===id);
const findDeck = (cat,id)=> cat && cat.decks.find(d=>d.id===id);

function routeState(){ return {view:route.view,catId:route.catId,deckId:route.deckId}; }
function go(r){
  route = Object.assign({}, route, r);
  try{ history.pushState(routeState(), ""); }catch(e){}
  render();
}
// browser Back / gesture: dismiss overlays first, else navigate views
window.addEventListener("popstate", e=>{
  const qa=document.getElementById("quitAsk");
  if(qa){ qa.remove(); try{history.pushState(routeState(),"");}catch(_){} return; }   // cancel quit-confirm
  if(Q){ quitQuiz(); try{history.pushState(routeState(),"");}catch(_){} return; }       // back = leave quiz (asks if mid-way)
  if($("#modalHost .scrim")){ closeModal(); try{history.pushState(routeState(),"");}catch(_){} return; } // back = close modal
  const st=e.state||{view:"home",catId:null,deckId:null};
  route={view:st.view||"home",catId:st.catId||null,deckId:st.deckId||null};
  render();
});

/* ================= RENDER ================= */
function render(){
  const v=$("#view");
  // auth gate: must sign in before entering (skipped only if Supabase can't load → offline local mode)
  if(!authReady){ renderCrumb(); v.innerHTML=bootingHTML(); renderAuth(); return; }
  if(sb && !session){ renderCrumb(); v.innerHTML=gateHTML(); wireGate(); renderAuth(); return; }
  renderCrumb();
  if(route.view==="cat") v.innerHTML=catHTML();
  else if(route.view==="me") v.innerHTML=meHTML();
  else v.innerHTML=homeHTML();
  v.classList.remove("fade"); void v.offsetWidth; v.classList.add("fade");
}
function bootingHTML(){
  return `<div class="gate"><div class="gate-card">
    <div class="brand" style="justify-content:center;font-size:20px"><span class="dot"></span>amgiBBang</div>
    <p style="color:var(--muted);margin-top:14px">불러오는 중…</p></div></div>`;
}
let gateMode="magic", gateEmailVal="";
function gateHTML(){
  const pwMode = gateMode==="password";
  return `<div class="gate"><div class="gate-card fade">
    <div class="gate-logo">🍞</div>
    <h1>amgiBBang <span>암기빵</span></h1>
    <p class="gate-sub">엑셀·PDF로 나만의 단어·문제를 만들어 4지선다로 외우는 학습앱.<br>로그인하면 폰·패드·PC 어디서든 <b>내 데이터</b>가 동기화돼요.</p>
    <div class="gate-form">
      <input type="text" id="gateEmail" inputmode="email" autocomplete="email" placeholder="you@example.com" value="${esc(gateEmailVal)}">
      ${pwMode?`<input type="password" id="gatePw" autocomplete="current-password" placeholder="비밀번호">`:``}
      <button class="btn primary" id="gateSend">${pwMode?"비밀번호로 로그인":"매직링크로 로그인"}</button>
    </div>
    <div class="parsebox idle" id="gateMsg">${pwMode?"비밀번호를 설정한 계정만 사용할 수 있어요. 처음이면 매직링크로 로그인 후, 계정 메뉴에서 비밀번호를 설정하세요.":"가입 절차 없이, 메일 링크를 누르면 자동으로 계정이 생성됩니다."}</div>
    <div class="gate-toggle-wrap"><button type="button" class="gate-toggle" id="gateToggle">${pwMode?"← 매직링크로 로그인":"비밀번호로 로그인 →"}</button></div>
  </div></div>`;
}
function wireGate(){
  const emailEl=$("#gateEmail");
  const captureEmail=()=>{ if(emailEl) gateEmailVal=emailEl.value; };
  const toggle=$("#gateToggle"); if(toggle) toggle.onclick=()=>{ captureEmail(); gateMode = gateMode==="password"?"magic":"password"; render(); };
  const send=async()=>{
    const email=($("#gateEmail").value||"").trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("올바른 이메일을 입력하세요");
    if(!sb) return toast("연결이 아직 준비되지 않았어요");
    const btn=$("#gateSend"), msg=$("#gateMsg");
    if(gateMode==="password"){
      const pw=($("#gatePw").value||"");
      if(pw.length<6) return toast("비밀번호를 입력하세요 (6자 이상)");
      btn.disabled=true; btn.textContent="로그인 중…";
      const { error }=await sb.auth.signInWithPassword({ email, password:pw });
      if(error){ msg.className="parsebox warn"; msg.textContent="로그인 실패 — 이메일/비밀번호를 확인하세요 (비밀번호 미설정이면 매직링크로)"; btn.disabled=false; btn.textContent="비밀번호로 로그인"; }
      // success → onAuthStateChange takes over
      return;
    }
    btn.disabled=true; btn.textContent="보내는 중…";
    const redirect=(location.protocol==="http:"||location.protocol==="https:")?location.origin+location.pathname:location.href;
    const { error }=await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: redirect } });
    if(error){ msg.className="parsebox warn"; msg.textContent="전송 실패: "+error.message; btn.disabled=false; btn.textContent="매직링크로 로그인"; }
    else { msg.className="parsebox ok"; msg.innerHTML="✓ <b>"+esc(email)+"</b> 로 링크를 보냈어요. 메일함(스팸함 포함)에서 링크를 누르면 로그인됩니다."; btn.textContent="전송됨 ✓"; }
  };
  const b=$("#gateSend"); if(b) b.onclick=send;
  ["gateEmail","gatePw"].forEach(id=>{ const el=$("#"+id); if(el) el.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();send();} }); });
  if(emailEl){ emailEl.addEventListener("input",captureEmail); if(!gateEmailVal) emailEl.focus(); else ($("#gatePw")||emailEl).focus(); }
}

function renderCrumb(){
  const c=$("#crumb");
  let h='<div class="crumb">';
  h+='<div class="brand"><span class="dot"></span>amgiBBang <small>암기빵</small></div>';
  if(route.view==="cat"){
    const cat=findCat(route.catId);
    h+='<span class="sep">/</span><button data-nav="home">홈</button>';
    h+='<span class="sep">/</span><span class="cur">'+esc(cat?cat.name:"")+'</span>';
  }else if(route.view==="me"){
    h+='<span class="sep">/</span><button data-nav="home">홈</button>';
    h+='<span class="sep">/</span><span class="cur">마이페이지</span>';
  }
  h+='</div>';
  c.innerHTML=h;
}

function homeHTML(){
  const totalDecks = DB.cats.reduce((n,c)=>n+c.decks.length,0);
  const totalItems = DB.cats.reduce((n,c)=>n+c.decks.reduce((m,d)=>m+d.items.length,0),0);
  let cards = DB.cats.map(c=>{
    const decks=c.decks.length, items=c.decks.reduce((m,d)=>m+d.items.length,0);
    const best = c.decks.length? Math.round(c.decks.reduce((m,d)=>m+(d.best||0),0)/c.decks.length):0;
    return `<button class="cat-card" data-open-cat="${c.id}">
      <span class="del" data-del-cat="${c.id}" title="삭제" role="button" tabindex="0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2m-9 0v14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6"/></svg>
      </span>
      <div class="emoji">${esc(c.emoji||"📚")}</div>
      <h3>${esc(c.name)}</h3>
      <div class="meta"><span class="mono">${decks}</span> 세트 · <span class="mono">${items}</span> 문항</div>
      <div class="bar"><i style="width:${best}%"></i></div>
    </button>`;
  }).join("");
  return `
   <div class="section-head" style="margin-top:30px">
     <div><div class="eyebrow">카테고리</div><h2>무엇을 외워볼까요?</h2></div>
   </div>
   <p style="color:var(--muted);margin:-6px 0 20px;font-size:14px">
     엑셀·CSV 파일을 올리거나 붙여넣어 나만의 단어장과 문제를 만들고, 4지선다로 풀어보세요.

/* ================= MY PAGE (stats) ================= */
function meHTML(){
  const email = session&&session.user? (session.user.email||"") : "";
  const all = DB.cats.flatMap(c=>c.decks.map(d=>({c,d})));
  const totalItems = all.reduce((n,x)=>n+x.d.items.length,0);
  const played = all.filter(x=>x.d.best!=null);
  const avgBest = played.length? Math.round(played.reduce((n,x)=>n+x.d.best,0)/played.length):0;
  const totalWrong = all.reduce((n,x)=>n+(x.d.wrong||[]).length,0);
  const totalFav = all.reduce((n,x)=>n+(x.d.fav||[]).length,0);
  const tile=(label,val,sub)=>`<div class="stat-tile"><div class="sv mono">${val}</div><div class="sl">${label}</div>${sub?`<div class="ss">${sub}</div>`:``}</div>`;
  const tiles = `<div class="stat-grid">
    ${tile("카테고리", DB.cats.length)}
    ${tile("학습 세트", all.length)}
    ${tile("총 문항", totalItems)}
    ${tile("평균 최고 정답률", played.length? avgBest+"%":"–", played.length?`푼 세트 ${played.length}개`:"아직 없음")}
    ${tile("누적 오답", totalWrong, "다시 풀면 줄어요")}
    ${tile("⭐ 즐겨찾기", totalFav)}
  </div>`;

  // weak: decks with accumulated wrongs (needs review)
  const weak = all.filter(x=>(x.d.wrong||[]).length>0).sort((a,b)=>b.d.wrong.length-a.d.wrong.length);
  const weakRows = weak.length ? weak.map(x=>`
    <div class="stat-row">
      <span class="sr-emoji">${esc(x.c.emoji||"📚")}</span>
      <span class="sr-info"><b>${esc(x.d.name)}</b><span class="sr-sub">${esc(x.c.name)} · 오답 <b>${x.d.wrong.length}</b>개</span></span>
      <button class="btn sm primary" data-review="${x.c.id}:${x.d.id}">오답 복습</button>
    </div>`).join("")
    : `<div class="me-empty">복습할 오답이 없어요. 완벽해요! 🎉</div>`;

  // scores: played decks, lowest best first (needs work at top)
  const scores = played.slice().sort((a,b)=>a.d.best-b.d.best);
  const scoreRows = scores.length ? scores.map(x=>`
    <div class="stat-row">
      <span class="sr-emoji">${esc(x.c.emoji||"📚")}</span>
      <span class="sr-info"><b>${esc(x.d.name)}</b><span class="sr-sub">${esc(x.c.name)}</span></span>
      <span class="sr-bar"><span class="t"><i style="width:${x.d.best}%"></i></span></span>
      <span class="sr-pct mono ${x.d.best>=80?'g':x.d.best>=50?'':'r'}">${x.d.best}%</span>
      <button class="btn sm ghost" data-open-deck="${x.c.id}:${x.d.id}">열기</button>
    </div>`).join("")
    : `<div class="me-empty">아직 푼 세트가 없어요. 세트를 풀면 최고 정답률이 기록돼요.</div>`;

  return `
   <div class="section-head" style="margin-top:30px">
     <div><div class="eyebrow">마이페이지</div><h2>내 학습 현황</h2></div>
   </div>
   <p style="color:var(--muted);margin:-6px 0 18px;font-size:14px">${esc(email)} · 정답률은 <b>전체 범위를 끝까지 푼 최고 기록</b> 기준이에요.</p>
   ${tiles}
   <div class="section-head"><div><h2 style="font-size:17px">복습이 필요한 세트</h2></div></div>
   <div class="stat-list">${weakRows}</div>
   <div class="section-head"><div><h2 style="font-size:17px">세트별 최고 정답률</h2></div></div>
   <div class="stat-list">${scoreRows}</div>`;
}

document.addEventListener("click", e=>{

  if(t.dataset.nav==="home") return go({view:"home",catId:null});
  if(t.dataset.nav==="me") return go({view:"me"});
  if(t.dataset.review!=null){

    if(d){ route={view:"cat",catId:cid}; startOpts={mode:"wrong",dir:"qa",shuffle:true,deckId:did}; launchQuiz(d); }
    return;
  }
  if(t.dataset.delCat!=null){ e.stopPropagation(); return delCat(t.dataset.delCat); }
  if(t.dataset.openCat!=null) return go({view:"cat",catId:t.dataset.openCat});
  if(t.dataset.openDeck!=null){ const [cid]=t.dataset.openDeck.split(":"); return go({view:"cat",catId:cid}); }
  if(t.hasAttribute("data-add-cat")) return addCatModal();
  if(t.hasAttribute("data-new-deck")) return deckModal();
  if(t.dataset.edit!=null){ e.stopPropagation(); return renameDeck(t.dataset.edit); }
  if(t.dataset.editv!=null){ e.stopPropagation(); const cat=findCat(route.catId); const d=findDeck(cat,t.dataset.editv); if(d) vocabEditorModal(d); return; }
  if(t.dataset.delDeck!=null){ e.stopPropagation(); return delDeck(t.dataset.delDeck); }
  if(t.dataset.play!=null) return startModal(t.dataset.play);
});

/* ---- vocab content editor: fix/add/delete word–meaning pairs ---- */
function veRow(q,a,orig){
  return `<div class="ve-row" data-orig="${orig}">
    <input type="text" class="ve-q" value="${esc(q)}" placeholder="단어">
    <input type="text" class="ve-a" value="${esc(a)}" placeholder="뜻">
    <button class="ve-del" type="button" title="삭제" aria-label="삭제">✕</button>
  </div>`;
}
function vocabEditorModal(deck){
  const orig0=deck.items.slice(); // snapshot for sid preservation
  const rowsHTML=deck.items.map((it,i)=>veRow(it.q,it.a,i)).join("");
  openModal(`<header><h3>단어 편집 · ${esc(deck.name)}</h3>${closeX()}</header>
    <div class="body ve-body">
      <div class="ve-head mono">단어 <span>·</span> 뜻 <span class="ve-count" id="veCount"></span></div>
      <div class="ve-list" id="veList">${rowsHTML}</div>
      <button class="btn sm" id="veAdd" style="margin-top:12px">+ 단어 추가</button>
    </div>
    <div class="foot">
      <button class="btn ghost" data-close>취소</button>
      <button class="btn primary" id="veSave">저장</button>
    </div>`);
  const list=$("#veList");
  const recount=()=>{ const n=list.querySelectorAll(".ve-row").length; const el=$("#veCount"); if(el) el.textContent=`(${n})`; };
  recount();
  list.addEventListener("click",e=>{ const b=e.target.closest(".ve-del"); if(!b)return; b.closest(".ve-row").remove(); recount(); });
  $("#veAdd").onclick=()=>{
    list.insertAdjacentHTML("beforeend", veRow("","",-1));
    recount();
    const last=list.lastElementChild; const q=last&&last.querySelector(".ve-q"); if(q) q.focus();
    last&&last.scrollIntoView({block:"nearest"});
  };
  $("#veSave").onclick=()=>{
    const rows=[...list.querySelectorAll(".ve-row")];
    const newItems=[]; const oldToNew={};
    rows.forEach(r=>{
      const q=(r.querySelector(".ve-q").value||"").trim();
      const a=(r.querySelector(".ve-a").value||"").trim();
      if(!q||!a) return; // drop incomplete rows
      const orig=+r.dataset.orig;
      oldToNew[orig]=newItems.length;
      const it={q,a};
      if(orig>=0 && orig0[orig] && orig0[orig].sid) it.sid=orig0[orig].sid; // keep server id
      newItems.push(it);
    });
    if(newItems.length<4) return toast("단어장은 4개 이상이어야 해요");
    const remap=arr=>[...new Set((arr||[]).map(i=>oldToNew[i]).filter(i=>i!=null))];
    deck.items=newItems; deck.fav=remap(deck.fav); deck.wrong=remap(deck.wrong);
    save(); closeModal(); render(); toast("저장됐어요 ✓");
  };
}

            ? `열 순서: <b>1열 = 단어, 2열 = 뜻</b>. 첫 줄이 머리글이면 자동으로 건너뜁니다.<br><b>단어 캡쳐(스크린샷) 이미지</b>도 올리면 글자를 인식(OCR)해 자동 입력돼요 — <code>단어 뜻</code>이 한 줄씩인 또렷한 캡쳐가 잘 됩니다(처음 한 번은 언어데이터를 받느라 느려요).`
            : `엑셀·CSV는 <b>문제 · 보기A~E · 정답</b> 열 순서. <b>PDF·캡쳐 이미지</b>는 <code>1. 문제 / A. 보기</code> 형식을 자동 인식해요(정답은 다음 단계에서 지정). 한글(.hwp)은 한글에서 <b>PDF로 저장</b> 후 올리세요.`}
        </div>
      </div>`;
    $("#fileIn").addEventListener("change",onFile);
  }
}

const EX_VOCAB="prompt\t신속한; 촉진하다\ntenant\t세입자, 임차인\nreimburse\t배상하다, 상환하다\nvacancy\t결원, 공석";
const EX_QUIZ="1. The number of stages in the high pressure turbine is:\nA. 1.\n*B. 2.\nC. 3.\nD. 4.\n\n2. The EEC data entry plug:\nA. Is matched to the EEC.\nB. Is matched to the engine.\n정답: B";

/* ================= PARSERS ================= */
function parseCSV(text){
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"')q=true;
      else if(ch===","){row.push(cur);cur="";}
      else if(ch==="\t"){row.push(cur);cur="";}
      else if(ch==="\r"){}
      else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
      else cur+=ch; } }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
// vocab PASTE -> items. Split per line on the FIRST delimiter only, so that
// commas inside a Korean meaning ("문지기, 관리인") are preserved.
function parseVocabPaste(text){
  const items=[];
  text.split(/\r?\n/).forEach((line,idx)=>{
    line=line.replace(/\r/g,"").trim();
    if(!line) return;
    let word,mean;
    if(line.includes("\t")){ const i=line.indexOf("\t"); word=line.slice(0,i).trim(); mean=line.slice(i+1).replace(/\t/g,", ").trim(); }
    else { const i=line.indexOf(","); if(i<0) return; word=line.slice(0,i).trim(); mean=line.slice(i+1).trim(); }
    if(idx===0 && /^(단어|word|english|영어|표제어?)$/i.test(word) && /(뜻|meaning|의미|한글|kor)/i.test(mean)) return;
    if(word&&mean) items.push({q:word,a:mean});
  });
  return items;
}
// vocab rows (real grid: .xlsx cells or quoted CSV) -> items.
// col0 = word; meaning = remaining NON-EMPTY cells joined (drops trailing empty
// columns like "waive","뜻","","" and re-joins an unquoted meaning that got
// split across columns, e.g. janitor,문지기, 관리인).
function rowsToVocab(rows){
  if(!rows.length) return [];
  const first=(rows[0]||[]).map(c=>String(c==null?"":c).trim());
  const nonEmpty0=first.filter(c=>c!=="");
  const kwHeader = /단어|word|english|영어|표제|term/i.test(first[0]||"")
                 && /뜻|meaning|kor|한글|의미|definition|def/i.test(first[1]||"");
  // header like "T","D","P","E": every non-empty cell is a 1–3 letter ASCII token
  const codeHeader = nonEmpty0.length>=2 && nonEmpty0.every(c=>/^[A-Za-z]{1,3}$/.test(c));
  const start = (kwHeader||codeHeader) ? 1 : 0;
  const items=[];
  for(let i=start;i<rows.length;i++){
    const r=(rows[i]||[]).map(c=>String(c==null?"":c).trim());
    const w=r[0]; if(!w) continue;
    const m=r.slice(1).filter(c=>c!=="").join(", ").replace(/\s*,\s*$/,"").trim();
    if(w&&m) items.push({q:w,a:m});
  }
  return items;
}
// quiz rows (structured columns) -> items
function rowsToQuiz(rows){
  let start=0;
  const h=(rows[0]||[]).map(c=>String(c).trim().toLowerCase());
  const hasHeader = h.some(c=>/정답|answer|ans|해답/.test(c)) || /문제|question|지문/.test(h[0]||"");
  if(hasHeader) start=1;
  const items=[];
  for(let i=start;i<rows.length;i++){
    const r=(rows[i]||[]).map(c=>String(c==null?"":c).trim());
    if(!r.length) continue;
    const q=r[0]; if(!q) continue;
    // choices = columns 1..n-1 that are non-empty, last non-empty col is answer key
    const rest=r.slice(1).filter(c=>c!=="");
    if(rest.length<2) continue;
    const ansRaw=rest[rest.length-1];
    const choices=rest.slice(0,rest.length-1);
    let ans=resolveAnswer(ansRaw,choices);
    if(ans<0){ // maybe answer wasn't a separate col; skip
      continue;
    }
    items.push({q,choices,answer:ans});
  }
  return items;
}
function resolveAnswer(raw,choices){
  raw=String(raw).trim();
  let m=raw.match(/^([A-Ea-e])[.)]?$/); if(m){ const i="abcde".indexOf(m[1].toLowerCase()); if(i<choices.length)return i; }
  m=raw.match(/^([1-9])[.)]?$/); if(m){ const i=+m[1]-1; if(i>=0&&i<choices.length)return i; }
  // full-text match
  const norm=s=>String(s).replace(/[.\s]+$/,"").trim().toLowerCase();
  const idx=choices.findIndex(c=>norm(c)===norm(raw)); if(idx>=0)return idx;
  const idx2=choices.findIndex(c=>norm(c).includes(norm(raw))&&norm(raw).length>1); if(idx2>=0)return idx2;
  return -1;
}
// quiz from free numbered text (pasted from PDF/교안)
function textToQuiz(text){
  const lines=text.split(/\r?\n/);
  const items=[]; let cur=null; let pendingAns=null;
  const flush=()=>{ if(cur&&cur.choices.length>=2){
      if(cur.answer<0 && pendingAns) cur.answer=resolveAnswer(pendingAns,cur.choices);
      if(cur.answer<0){ cur.answer=0; cur.__guessed=true; } // no mark found → needs review
      items.push(cur);
    } cur=null; pendingAns=null; };
  for(let raw of lines){
    const line=raw.replace(/ /g," ").trim();
    if(!line){ continue; }
    let m=line.match(/^정답\s*[:：]\s*(.+)$/i)||line.match(/^answer\s*[:：]\s*(.+)$/i);
    if(m){ pendingAns=m[1].trim(); continue; }
    // choice line: A. / A) / (A) / * A.
    m=line.match(/^(\*?)\s*\(?([A-Ea-e])\)?[.)]\s+(.*\S)\s*$/);
    if(m && cur){
      const star=m[1]==="*"; const txt=m[3].replace(/\s*\*\s*$/,"").trim();
      const starred = star || /\*$/.test(m[3].trim());
      cur.choices.push(txt);
      if(starred) cur.answer=cur.choices.length-1;
      continue;
    }
    // question line: "1." "1)" "12."
    m=line.match(/^\(?(\d{1,3})\)?[.)]\s+(.*\S)\s*$/);
    if(m){ flush(); cur={q:m[2].trim(),choices:[],answer:-1}; continue; }
    // continuation of question stem (no choices yet)
    if(cur && cur.choices.length===0){ cur.q+=" "+line; }
  }
  flush();
  return items;
}

function currentInputText(){ const a=$("#pasteArea"); return a? a.value : ""; }
// does this text look like multiple-choice questions (not word→meaning)?
function looksLikeQuiz(text){
  if(!text) return false;
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const choiceLines=lines.filter(l=>/^\*?\s*\(?[A-Ea-e]\)?[.)]\s+\S/.test(l)).length;
  const numLines=lines.filter(l=>/^\(?\d{1,3}\)?[.)]\s+\S/.test(l)).length;
  return choiceLines>=3 && (choiceLines+numLines)>=5;
}
function switchToQuiz(){
  const savedText=deckDraft.__srcText||"";
  deckDraft.type="quiz";
  const seg=$("#typeSeg"); if(seg) [...seg.children].forEach(x=>x.setAttribute("aria-pressed", x.dataset.type==="quiz"));
  renderMethod();
  if(deckDraft.method==="paste"){ const ta=$("#pasteArea"); if(ta) ta.value=savedText; } // renderMethod cleared it
  reparse();
}
function reparse(){
  let items=[];
  if(deckDraft.method==="paste"){
    const text=currentInputText();
    deckDraft.__srcText=text;
    if(deckDraft.type==="vocab") items=parseVocabPaste(text);
    else {
      // try structured table first; if weak, fall back to numbered text
      const tbl=rowsToQuiz(parseCSV(text));
      const txt=textToQuiz(text);
      items = txt.length>=tbl.length? txt : tbl;
    }
  } else if(deckDraft.__srcText){
    // file mode: re-derive from cached OCR/PDF text (so a type switch re-parses)
    items = deckDraft.type==="vocab" ? imageTextToVocab(deckDraft.__srcText) : textToQuiz(deckDraft.__srcText);
  } else items = deckDraft.items;
  deckDraft.items=items;
  updateParseBox(items);
}
function updateParseBox(items){
  const box=$("#pbox"), btn=$("#dCreate"); if(!box)return;
  // vocab type but the source is clearly A/B/C/D questions → nudge to switch (even if 0 words parsed)
  if(deckDraft.type==="vocab" && looksLikeQuiz(deckDraft.__srcText)){
    box.className="parsebox warn";
    box.innerHTML=`⚠️ <b>객관식 문제 형식</b>으로 보여요 — 단어장으로 만들면 뜻이 뒤섞여요. `
      +`<a class="link" id="switchQuiz">‘객관식 문제’로 바꾸기</a> 를 눌러보세요.`;
    const sw=$("#switchQuiz"); if(sw) sw.onclick=switchToQuiz;
    if(btn) btn.disabled = !items.length; // block create while it's still mis-typed & empty
    updateChunkHint(); return;
  }
  if(!items.length){ box.className="parsebox idle"; box.textContent="아직 인식된 항목이 없어요."; if(btn)btn.disabled=true; return; }
  if(deckDraft.type==="vocab"){
    box.className="parsebox ok";
    box.innerHTML=`✓ 단어 <b>${items.length}</b>개 인식됨 &nbsp;·&nbsp; 예: <b>${esc(items[0].q)}</b> → ${esc(items[0].a)}`;
  } else {
    const guessed=items.filter(x=>x.__guessed).length;
    box.className="parsebox ok";
    box.innerHTML=`✓ 문제 <b>${items.length}</b>개 인식됨`
      + (guessed
          ? ` &nbsp;·&nbsp; 정답 확인 필요 <b>${guessed}</b>개 <span style="opacity:.8">(다음 단계에서 지정)</span>`
          : ` &nbsp;·&nbsp; 정답 포함됨`);
  }
  if(btn) btn.disabled=false;
  updateChunkHint();
}
function updateChunkHint(){
  const onEl=$("#chunkOn"); const on=onEl&&onEl.checked;
  const sizeEl=$("#chunkSize"); const size=on? Math.max(1, parseInt((sizeEl&&sizeEl.value)||"0",10)||0):0;
  deckDraft.chunk = on? size : 0;
  const hint=$("#chunkHint"); if(!hint) return;
  const n=(deckDraft.items||[]).length;
  hint.textContent = (on && size>0 && n>0) ? `총 ${n}개 → ${Math.ceil(n/size)}회차` : "";
}

async function onFile(e){
  const f=e.target.files[0]; if(!f)return;
  $("#fileName").textContent=f.name;
  const box=$("#pbox"); box.className="parsebox idle";
  const isXlsx=/\.xlsx$/i.test(f.name);
  const isPdf=/\.pdf$/i.test(f.name);
  const isImg=/\.(png|jpe?g|webp|bmp|gif)$/i.test(f.name) || /^image\//.test(f.type||"");
  box.textContent= isImg ? "이미지 준비 중…" : isPdf ? "PDF 읽는 중… (처음엔 몇 초 걸려요)" : "파일 읽는 중…";
  try{
    let items;
    if(isImg){
      // OCR the screenshot, then parse like pasted text
      const text=await readImage(f, m=>{
        if(m&&m.status==="recognizing text"){ box.className="parsebox idle"; box.textContent=`글자 인식 중… ${Math.round((m.progress||0)*100)}%`; }
        else if(m&&m.status){ box.className="parsebox idle"; box.textContent=`OCR 준비 중… (${m.status}) — 처음엔 언어데이터를 받느라 좀 걸려요`; }
      });
      deckDraft.__srcText=text;
      items = deckDraft.type==="vocab" ? imageTextToVocab(text) : textToQuiz(text);
    } else if(isPdf){
      // PDF -> text -> numbered-question parser (or vocab paste for word lists)
      const text=await readPdf(await f.arrayBuffer());
      deckDraft.__srcText=text;
      items = deckDraft.type==="vocab" ? parseVocabPaste(text) : textToQuiz(text);
    } else if(deckDraft.type==="vocab"){
      // both xlsx and text files go through a real table parser so that
      // quoted CSV ("waive","뜻","","") and unquoted commas both come out clean.
      const rows = isXlsx ? await readXlsx(await f.arrayBuffer()) : parseCSV(await f.text());
      items = rowsToVocab(rows);
    } else {
      const rows = isXlsx ? await readXlsx(await f.arrayBuffer()) : parseCSV(await f.text());
      items = rowsToQuiz(rows);
      if(items.length===0) items = textToQuiz(rows.map(r=>r.join(" ")).join("\n"));
    }
    deckDraft.items=items;
    if(!$("#dName").value.trim()) $("#dName").value=f.name.replace(/\.(xlsx|csv|txt|tsv|pdf|png|jpe?g|webp|bmp|gif)$/i,"");
    updateParseBox(items);
    if(isImg && !items.length){ box.className="parsebox warn"; box.textContent="글자를 못 읽었어요. 더 또렷한(고해상도) 캡쳐이거나, 한 줄에 '단어 뜻' 형태면 잘 돼요."; }
  }catch(err){
    box.className="parsebox warn";
    box.textContent= isImg ? "이미지 인식에 실패했어요. 캡쳐가 또렷한지 확인하거나 붙여넣기를 사용해 보세요."
                   : isPdf ? "PDF를 읽지 못했어요. 텍스트가 이미지로만 된 스캔본이면 인식이 안 될 수 있어요."
                           : "파일을 읽지 못했어요. CSV로 저장하거나 붙여넣기를 사용해 보세요.";
    console.error(err);
  }
}

function createDeck(){
  const cat=findCat(route.catId); if(!cat)return;
  const items=deckDraft.items;
  if(!items.length) return toast("인식된 항목이 없어요");
  if(deckDraft.type==="vocab" && items.length<4) return toast("4지선다를 만들려면 단어가 4개 이상 필요해요");
  const name=($("#dName").value||"").trim() || (deckDraft.type==="vocab"?"새 단어장":"새 문제 세트");
  // quiz with unconfirmed answers → let the user set them first
  if(deckDraft.type==="quiz" && items.some(x=>x.__guessed)) return answerEditorModal(name,items);
  finalizeDeck(name,items);
}
function finalizeDeck(name,items){
  const cat=findCat(route.catId); if(!cat)return;
  items.forEach(it=>{ delete it.__guessed; });
  const type=deckDraft.type;
  const mkDeck=(nm,its)=>({id:uid(),name:nm,type,created:Date.now(),items:its,fav:[],wrong:[],best:null});
  const size=deckDraft.chunk|0;
  if(size>0 && items.length>size){
    // split into rounds of `size`
    const slices=[]; for(let i=0;i<items.length;i+=size) slices.push(items.slice(i,i+size));
    // vocab needs ≥4 per deck for a 4-choice quiz → merge a too-small last round
    if(type==="vocab" && slices.length>1 && slices[slices.length-1].length<4){
      const last=slices.pop(); slices[slices.length-1]=slices[slices.length-1].concat(last);
    }
    slices.forEach((s,i)=>cat.decks.push(mkDeck(`${name} · ${i+1}회차`, s)));
    save(); closeModal(); render(); toast(`${slices.length}개 회차로 나눠 추가됐어요 ✓`);
  }else{
    cat.decks.push(mkDeck(name, items));
    save(); closeModal(); render(); toast("세트가 추가됐어요 ✓");
  }
}

/* ---- answer editor: set the correct choice per question ---- */
function answerEditorModal(name,items){
  const cards=items.map((it,qi)=>`
    <div class="ae-q${it.__guessed?' need':''}" data-q="${qi}">
      <div class="ae-stem"><span class="ae-num mono">${qi+1}</span><span>${esc(it.q)}</span>
        ${it.__guessed?'<span class="ae-badge">정답?</span>':''}</div>
      <div class="ae-choices">
        ${it.choices.map((c,ci)=>`<button class="ae-choice${ci===it.answer?' sel':''}" data-q="${qi}" data-c="${ci}">
            <span class="idx mono">${"ABCDE"[ci]||(ci+1)}</span><span>${esc(c)}</span></button>`).join("")}
      </div>
    </div>`).join("");
  openModal(`<header><h3>정답 지정 · ${esc(name)}</h3>${closeX()}</header>
    <div class="body ae-body">
      <div class="parsebox ${items.some(x=>x.__guessed)?'warn':'ok'} ae-info" id="aeInfo"></div>
      ${cards}
    </div>
    <div class="foot">
      <button class="btn ghost" data-close>취소</button>
      <button class="btn" id="aeSkip">정답 없는 문제 빼기</button>
      <button class="btn primary" id="aeDone">세트 만들기</button>
    </div>`);
  const refresh=()=>{
    const left=items.filter(x=>x.__guessed).length;
    const el=$("#aeInfo"), skip=$("#aeSkip"), done=$("#aeDone");
    if(left){
      el.className="parsebox warn ae-info";
      el.innerHTML=`정답을 못 찾은 문제 <b>${left}</b>개 — 맞는 보기를 눌러 지정하거나, 아래 <b>“정답 없는 문제 빼기”</b>로 제외하세요.`;
      skip.classList.remove("hide"); skip.textContent=`정답 없는 ${left}개 빼고 만들기`;
      done.textContent=`그대로 만들기 (미지정은 A)`;
    }else{
      el.className="parsebox ok ae-info"; el.innerHTML="✓ 모든 문제의 정답이 지정됐어요.";
      skip.classList.add("hide"); done.textContent="세트 만들기";
    }
  };
  refresh();
  $(".ae-body").addEventListener("click",e=>{
    const b=e.target.closest(".ae-choice"); if(!b)return;
    const qi=+b.dataset.q, ci=+b.dataset.c;
    items[qi].answer=ci; items[qi].__guessed=false;
    const card=b.closest(".ae-q"); card.classList.remove("need");
    const badge=card.querySelector(".ae-badge"); if(badge)badge.remove();
    [...card.querySelectorAll(".ae-choice")].forEach(x=>x.classList.toggle("sel",x===b));
    refresh();
  });
  $("#aeSkip").onclick=()=>{
    const kept=items.filter(x=>!x.__guessed);
    if(!kept.length) return toast("정답을 지정한 문제가 없어요");
    finalizeDeck(name,kept);
  };
  $("#aeDone").onclick=()=>finalizeDeck(name,items);
}

/* ================= XLSX reader (no external lib) ================= */
async function inflateRaw(bytes){
  if(typeof DecompressionStream==="undefined") throw new Error("no DecompressionStream");
  const ds=new DecompressionStream("deflate-raw");
  const stream=new Response(new Blob([bytes]).stream().pipeThrough(ds));
  return new Uint8Array(await stream.arrayBuffer());
}
async function readXlsx(buf){
  const dv=new DataView(buf); const bytes=new Uint8Array(buf);
  // find End of Central Directory
  let eocd=-1;
  for(let i=bytes.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error("not a zip");
  const cdCount=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  const files={};
  for(let n=0;n<cdCount;n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true);
    const compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true);
    const extraLen=dv.getUint16(off+30,true);
    const commLen=dv.getUint16(off+32,true);
    const localOff=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(bytes.subarray(off+46,off+46+nameLen));
    files[name]={method,compSize,localOff};
    off+=46+nameLen+extraLen+commLen;
  }
  async function extract(name){
    const f=files[name]; if(!f)return null;
    const lh=f.localOff;
    if(dv.getUint32(lh,true)!==0x04034b50) return null;
    const nLen=dv.getUint16(lh+26,true); const eLen=dv.getUint16(lh+28,true);
    const dataStart=lh+30+nLen+eLen;
    const raw=bytes.subarray(dataStart,dataStart+f.compSize);
    const out = f.method===0? raw : await inflateRaw(raw);
    return new TextDecoder().decode(out);
  }
  // shared strings
  const shared=[]; const ssXml=await extract("xl/sharedStrings.xml");
  if(ssXml){
    const re=/<si>([\s\S]*?)<\/si>/g; let m;
    while((m=re.exec(ssXml))){
      const ts=[...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]);
      shared.push(unxml(ts.join("")));
    }
  }
  // first worksheet
  const wbXml=await extract("xl/workbook.xml");
  let sheetPath="xl/worksheets/sheet1.xml";
  // resolve first sheet via rels (best-effort; default is fine for most)
  const sheetXml=await extract(sheetPath) || await extract("xl/worksheets/sheet01.xml");
  if(!sheetXml) throw new Error("no sheet");
  const rows=[];
  const rowRe=/<row[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while((rm=rowRe.exec(sheetXml))){
    const cells=[]; const cRe=/<c([^>]*)>([\s\S]*?)<\/c>|<c([^>]*)\/>/g; let cm;
    while((cm=cRe.exec(rm[1]))){
      const attr=(cm[1]||cm[3]||""); const inner=cm[2]||"";
      const ref=(attr.match(/r="([A-Z]+)\d+"/)||[])[1];
      const type=(attr.match(/t="([^"]+)"/)||[])[1];
      let val="";
      const vM=inner.match(/<v[^>]*>([\s\S]*?)<\/v>/);
      const isM=inner.match(/<t[^>]*>([\s\S]*?)<\/t>/); // inline string
      if(type==="s" && vM){ val=shared[+vM[1]]||""; }
      else if(type==="inlineStr" && isM){ val=unxml(isM[1]); }
      else if(vM){ val=unxml(vM[1]); }
      const col=ref?colNum(ref):cells.length;
      cells[col]=val;
    }
    for(let i=0;i<cells.length;i++) if(cells[i]==null)cells[i]="";
    rows.push(cells);
  }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
function colNum(ref){ let n=0; for(const ch of ref){ n=n*26+(ch.charCodeAt(0)-64);} return n-1; }
function unxml(s){ return String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d)).replace(/&amp;/g,"&"); }

const PDFJS_VER="4.10.38";
let _pdfjs=null;
async function ensurePdfjs(){
  if(_pdfjs) return _pdfjs;
  const m=await import(`https://esm.sh/pdfjs-dist@${PDFJS_VER}/build/pdf.min.mjs`);
  try{ m.GlobalWorkerOptions.workerSrc=`https://esm.sh/pdfjs-dist@${PDFJS_VER}/build/pdf.worker.min.mjs`; }catch(e){}
  _pdfjs=m; return m;
}
// PDF -> plain text with line breaks (so textToQuiz's line rules work).
async function readPdf(buf){
  const pdfjs=await ensurePdfjs();
  const doc=await pdfjs.getDocument({data:new Uint8Array(buf)}).promise;
  let out="";
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const tc=await page.getTextContent();
    let line="";
    for(const it of tc.items){ line+=it.str; if(it.hasEOL){ out+=line+"\n"; line=""; } }
    if(line) out+=line+"\n";
    out+="\n"; // blank line between pages
  }
  try{ doc.destroy(); }catch(e){}
  return out;
}

/* ================= OCR (tesseract.js, loaded on demand) ================= */
let _tess=null;
async function ensureTesseract(){
  if(_tess) return _tess;
  const m=await import("https://esm.sh/tesseract.js@5");
  _tess = m.recognize? m : (m.default||m);
  return _tess;
}
// image (screenshot) -> recognized text. Korean + English.
async function readImage(file, onProgress){
  const T=await ensureTesseract();
  const recognize = T.recognize || (T.default&&T.default.recognize);
  const { data }=await recognize(file, "eng+kor", { logger: m=>{ if(onProgress) onProgress(m); } });
  return (data&&data.text)||"";
}
// OCR text of a vocab screenshot -> items. Handles "word 뜻" (space-separated)
// by splitting at the first Hangul char; falls back to tab/2+spaces columns.
function imageTextToVocab(text){
  const items=[];
  text.split(/\r?\n/).forEach(raw=>{
    let line=raw.replace(/\s+/g," ").trim();
    if(!line) return;
    line=line.replace(/^\d+[.)\s]+/,"").trim(); // drop leading "1. "
    let word,mean;
    if(line.includes("\t")){ const i=line.indexOf("\t"); word=line.slice(0,i); mean=line.slice(i+1); }
    else{
      const h=line.match(/[가-힣]/); // English word → Korean meaning
      if(h){ word=line.slice(0,h.index); mean=line.slice(h.index); }
      else{ const parts=line.split(/\s{2,}/); if(parts.length>=2){ word=parts[0]; mean=parts.slice(1).join(" "); } else return; }
    }
    word=(word||"").replace(/[|"'`_]+/g," ").trim();
    mean=(mean||"").trim();
    if(word && mean) items.push({q:word,a:mean});
  });
  return items;
}

function renderQuestion(){

function toggleFav(){
  const {deck,curOrigIdx}=Q; deck.fav=deck.fav||[];

function answer(sel){
  if(Q.answered)return; Q.answered=true;
  const {deck,correctIdx,curOrigIdx}=Q;
  const btns=[...document.querySelectorAll("#choices .choice")];
  btns.forEach((b,i)=>{ b.disabled=true;
    if(i===correctIdx)b.classList.add("correct");
    else if(i===sel)b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const ok = sel===correctIdx;
  deck.wrong=deck.wrong||[];
  if(ok){ Q.correct++; const wi=deck.wrong.indexOf(curOrigIdx); if(wi>=0)deck.wrong.splice(wi,1); }
  else {
    Q.wrong.push({q:Q.isV?promptTextForReview():deck.items[curOrigIdx].q,
                  correct:Q.choicesShown[correctIdx],
                  chosen: sel>=0? Q.choicesShown[sel] : "(모르겠어요)"});
    if(!deck.wrong.includes(curOrigIdx))deck.wrong.push(curOrigIdx);
  }
  save();
  const delay = ok?620:900;
  setTimeout(next,delay);
}
function promptTextForReview(){
  const {deck,curOrigIdx,dir}=Q; const it=deck.items[curOrigIdx];

}

      ? location.origin+location.pathname : location.href;
    const { error }=await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: redirect } });
    if(error){
      msg.className="parsebox warn"; msg.textContent="전송 실패: "+error.message;
      btn.disabled=false; btn.textContent="매직링크 보내기";
    }else{
      msg.className="parsebox ok";
      msg.innerHTML="✓ <b>"+esc(email)+"</b> 로 링크를 보냈어요. 메일함(스팸함 포함)을 확인하세요.";
      btn.textContent="전송됨 ✓";
    }
  };
  $("#sendLink").onclick=send;
  const inp=$("#loginEmail");
  if(inp) inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); send(); }});
}

/* ---- pull: rebuild in-memory DB from server rows ---- */
async function pullAll(){
  const q=t=>sb.from(t).select("*").order("sort",{ascending:true});
  const [cr,dr,ir]=await Promise.all([q("categories"),q("decks"),q("items")]);
  if(cr.error) throw cr.error; if(dr.error) throw dr.error; if(ir.error) throw ir.error;
  const cats=cr.data||[], decks=dr.data||[], items=ir.data||[];
  const out={cats:[]}, catById={}, deckById={};
  cats.forEach(c=>{ const cat={id:c.id,sid:c.id,name:c.name,emoji:c.emoji||"📚",decks:[]}; catById[c.id]=cat; out.cats.push(cat); });
  decks.forEach(d=>{
    const cat=catById[d.category_id]; if(!cat) return;
    const deck={id:d.id,sid:d.id,name:d.name,type:d.type,created:Date.parse(d.created_at)||Date.now(),
                items:[],fav:[],wrong:[],best:(d.best==null?null:d.best)};
    deckById[d.id]=deck; cat.decks.push(deck);
  });
  items.forEach(it=>{
    const deck=deckById[it.deck_id]; if(!deck) return;
    const idx=deck.items.length;
    const item={sid:it.id, q:it.q};
    if(it.a!=null) item.a=it.a;
    if(it.choices!=null) item.choices=it.choices;
    if(it.answer!=null) item.answer=it.answer;
    deck.items.push(item);
    if(it.fav) deck.fav.push(idx);
    if(it.wrong) deck.wrong.push(idx);
  });
  return out;
}

/* ---- push: mirror the whole DB up (upsert all + delete orphans) ---- */
async function pushAll(){
  if(!sb||!session||!session.user) return;
  syncState="busy"; renderAuth();
  const uidv=session.user.id;
  const cats=[], decks=[], items=[];
  DB.cats.forEach((c,ci)=>{
    if(!c.sid) c.sid=uuid();
    cats.push({id:c.sid,user_id:uidv,name:c.name,emoji:c.emoji||"📚",sort:ci});
    (c.decks||[]).forEach((d,di)=>{
      if(!d.sid) d.sid=uuid();
      decks.push({id:d.sid,user_id:uidv,category_id:c.sid,name:d.name,type:d.type,
                  best:(d.best==null?null:d.best),sort:di});
      const fav=new Set(d.fav||[]), wrong=new Set(d.wrong||[]);
      (d.items||[]).forEach((it,ii)=>{
        if(!it.sid) it.sid=uuid();
        items.push({id:it.sid,user_id:uidv,deck_id:d.sid,sort:ii,
          q:it.q, a:(it.a!=null?it.a:null),
          choices:(it.choices!=null?it.choices:null),
          answer:(it.answer!=null?it.answer:null),
          fav:fav.has(ii), wrong:wrong.has(ii)});
      });
    });
  });
  let err=null;
  const up=async(t,rows)=>{ if(!rows.length) return; const {error}=await sb.from(t).upsert(rows); if(error) throw error; };
  try{
    // parents first (FK), then children
    await up("categories",cats);
    await up("decks",decks);
    await up("items",items);
    // remove rows deleted locally — children first
    await delOrphans("items",items.map(x=>x.id));
    await delOrphans("decks",decks.map(x=>x.id));
    await delOrphans("categories",cats.map(x=>x.id));
    persistLocal(); // persist newly-assigned sids so reloads keep the mapping
    syncState="ok";
  }catch(e){ err=e; syncState="err"; }
  renderAuth();
  if(err) throw err;
}
async function delOrphans(t,keepIds){
  const keep=new Set(keepIds);
  const { data, error }=await sb.from(t).select("id");
  if(error) throw error;
  const gone=(data||[]).map(r=>r.id).filter(id=>!keep.has(id));
  for(let i=0;i<gone.length;i+=200){
    const { error:e2 }=await sb.from(t).delete().in("id",gone.slice(i,i+200));
    if(e2) throw e2;
  }
}

/* ---- session lifecycle ---- */
async function bootstrapSync(){
  try{
    syncState="busy"; renderAuth();
    const remote=await pullAll();
    if(remote.cats.length){
      // server has data -> it wins (online-first). replace local, cache it.
      DB=remote; persistLocal(); syncReady=true;
      syncState="ok"; renderAuth();
      go({view:"home",catId:null});
      toast("동기화됨 ✓");
    }else{
      // server empty -> one-time migrate the local data (seed or user's) up.
      const hadLocal=DB.cats.length>0;
      syncReady=true;
      await pushAll();
      toast(hadLocal? "기존 데이터를 계정에 업로드했어요 ✓" : "동기화 준비 완료 ✓");
      render();
    }
  }catch(e){
    console.warn("[sync] bootstrap failed",e);
    syncState="err"; renderAuth();
    toast("동기화 실패 — 오프라인 모드로 계속합니다");
  }
}

function maybePromptPassword(){
  if(!sb||!session||!session.user) return;
  if(!justSignedInViaMagic) return;            // only right after a magic-link login
  const key="amgi.pwPrompted."+session.user.id;
  try{ if(localStorage.getItem(key)) return; localStorage.setItem(key,"1"); }catch(e){}
  setTimeout(()=>{ if(!Q && !$("#modalHost .scrim")) setPasswordModal(true); }, 700);
}
async function onSession(s, ev){
  authReady=true; // auth has resolved at least once
  const was=session&&session.user? session.user.id : null;
  session=s;
  const now=s&&s.user? s.user.id : null;
  renderAuth();
  if(now && now!==was){
    // detect magic-link return (token in URL hash) BEFORE we scrub it
    const viaMagic=location.hash.includes("access_token");
    justSignedInViaMagic = viaMagic && ev!=="TOKEN_REFRESHED";
    if(viaMagic) history.replaceState(null,"",location.pathname+location.search);
    await bootstrapSync();
    maybePromptPassword();
  }else if(!now && was){
    // signed out → drop local cache (don't leak to next account) and show the gate
    syncReady=false; syncState="idle"; DB={cats:[]}; persistLocal();
    route={view:"home",catId:null,deckId:null};
    renderAuth(); render();
    toast("로그아웃되었습니다");
  }else{
    render(); // no change (initial no-session → gate; token refresh → app)
  }
}

async function initSupabase(){
  try{
    const { createClient }=await import("https://esm.sh/@supabase/supabase-js@2");
    // implicit flow: magic link carries the token in the URL hash, so it works
    // even when the email app opens the link in a different browser/webview
    // (PKCE would require the same browser that requested the link — breaks on mobile).
    sb=createClient(SUPA_URL,SUPA_KEY,{ auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:"implicit" } });
  }catch(e){
    console.warn("[supa] client failed to load — running local-only",e);
    sb=null; authReady=true; renderAuth(); render(); return;
  }
  sb.auth.onAuthStateChange((ev,s)=>{ onSession(s,ev); });
  try{ const { data:{ session:s } }=await sb.auth.getSession(); await onSession(s,"INITIAL_SESSION"); }
  catch(e){ console.warn("[supa] getSession failed",e); authReady=true; renderAuth(); render(); }
}

/* ================= go ================= */
renderAuth();
render();
initSupabase();
</script>
