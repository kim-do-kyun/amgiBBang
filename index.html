<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="엑셀·CSV로 단어와 문제를 올려 4지선다로 외우는 학습 웹앱">
<meta name="theme-color" content="#5a5be0">
<title>amgiBBang · 암기빵</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍞%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel-2:#fbfbfe;
  --ink:#1b1c26; --muted:#6a6c7d; --faint:#9a9cad;
  --line:#e9eaf1; --line-2:#dfe0ea;
  --accent:#5a5be0; --accent-soft:#ececfb; --accent-ink:#4344c9;
  --good:#1f9d62; --good-soft:#e5f5ec;
  --bad:#e0403f; --bad-soft:#fceceb;
  --star:#f4b740;
  --shadow:0 1px 2px rgba(24,25,45,.05),0 8px 26px rgba(24,25,45,.06);
  --shadow-lg:0 12px 44px rgba(24,25,45,.14);
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131319; --panel:#1d1e26; --panel-2:#232430;
    --ink:#ecedf4; --muted:#a2a4b6; --faint:#71738a;
    --line:#2b2c39; --line-2:#353747;
    --accent:#8a8bf2; --accent-soft:#26263a; --accent-ink:#b9b9fb;
    --good:#3fbd7e; --good-soft:#17301f;
    --bad:#f0605f; --bad-soft:#331919;
    --star:#f5c25b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 16px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#131319; --panel:#1d1e26; --panel-2:#232430;
  --ink:#ecedf4; --muted:#a2a4b6; --faint:#71738a;
  --line:#2b2c39; --line-2:#353747;
  --accent:#8a8bf2; --accent-soft:#26263a; --accent-ink:#b9b9fb;
  --good:#3fbd7e; --good-soft:#17301f;
  --bad:#f0605f; --bad-soft:#331919;
  --star:#f5c25b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 16px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5;
  min-height:100vh;
}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
::selection{background:var(--accent-soft)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .row{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;letter-spacing:-.01em}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.brand small{font-weight:700;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.icon-btn:hover{background:var(--panel);border-color:var(--line);color:var(--ink)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-width:0}
.crumb button{color:var(--muted);font-weight:600}
.crumb button:hover{color:var(--ink)}
.crumb .cur{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--faint)}

/* ---------- generic ---------- */
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:34px 0 16px}
.section-head h2{font-size:20px;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:10px 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);transition:transform .06s,background .15s,border-color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--panel)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* ---------- home: category cards ---------- */
.grid{display:grid;gap:14px}
.cat-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cat-card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);transition:transform .12s,border-color .15s;overflow:hidden}
.cat-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.cat-card .emoji{font-size:26px;line-height:1;filter:saturate(1.05)}
.cat-card h3{font-size:18px;margin-top:14px;letter-spacing:-.01em}
.cat-card .meta{margin-top:6px;color:var(--muted);font-size:13px}
.cat-card .bar{margin-top:16px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.cat-card .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cat-card .del{position:absolute;top:12px;right:12px;opacity:0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.cat-card:hover .del{opacity:1}
.cat-card .del:hover{background:var(--bad-soft);color:var(--bad)}
.add-card{border:1.5px dashed var(--line-2);background:transparent;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);min-height:150px;font-weight:700}
.add-card:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--panel-2)}
.add-card .plus{font-size:26px;line-height:1;font-weight:400}

/* ---------- deck rows ---------- */
.deck{display:flex;align-items:center;gap:16px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;box-shadow:var(--shadow);transition:border-color .15s,transform .1s}
.deck:hover{border-color:var(--accent);transform:translateY(-2px)}
.deck .kind{flex:none;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.02em}
.kind.vocab{background:var(--accent-soft);color:var(--accent-ink)}
.kind.quiz{background:var(--good-soft);color:var(--good)}
.deck .info{flex:1;min-width:0}
.deck .info h3{font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .info .sub{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.deck .info .sub .mono{color:var(--faint)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.deck .go{flex:none;color:var(--faint)}
.deck-actions{flex:none;display:flex;gap:4px}
.deck-actions .icon-btn{width:34px;height:34px}
.mini-bar{flex:none;width:74px}
.mini-bar .t{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mini-bar .t i{display:block;height:100%;background:var(--good);border-radius:99px}
.mini-bar .n{font-size:10px;color:var(--faint);text-align:right;margin-top:4px}

.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .big{font-size:34px}
.empty h3{margin:12px 0 6px;color:var(--ink)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,20,35,.5);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.modal{width:100%;max-width:600px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden;margin:auto}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal header h3{font-size:16px}
.modal .body{padding:20px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--line);background:var(--panel-2)}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}
.field .hint{color:var(--muted);font-weight:400;font-size:12px;margin-top:5px;line-height:1.55}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel-2);color:var(--ink);font-size:14px;font-family:inherit}
textarea{width:100%;min-height:150px;padding:12px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel-2);color:var(--ink);font-size:13px;font-family:"JetBrains Mono",monospace;line-height:1.6;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);padding:4px;border-radius:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--accent-ink);box-shadow:var(--shadow)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:0 0 10px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.parsebox{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.parsebox.ok{background:var(--good-soft);color:var(--good)}
.parsebox.warn{background:var(--bad-soft);color:var(--bad)}
.parsebox.idle{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.chip-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.link{color:var(--accent-ink);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:2px}

/* ---------- QUIZ PLAYER ---------- */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.p-top{height:60px;display:flex;align-items:center;gap:16px;padding:0 20px}
.progressline{position:absolute;left:0;right:0;top:0;height:4px;background:var(--line)}
.progressline i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
.p-count{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;letter-spacing:.02em}
.p-count b{color:var(--accent-ink)}
.p-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 20px 8px;min-height:0}
.card{width:100%;max-width:680px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:44px 32px;min-height:min(46vh,360px);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center}
.card .star{position:absolute;top:18px;left:18px;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--faint);font-size:20px}
.card .star:hover{background:var(--panel-2);color:var(--star)}
.card .star.on{color:var(--star)}
.card .qtag{position:absolute;top:22px;right:22px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint);letter-spacing:.08em}
.prompt-word{font-size:clamp(32px,6vw,54px);font-weight:900;letter-spacing:-.02em;line-height:1.15}
.prompt-q{font-size:clamp(19px,3.2vw,25px);font-weight:700;letter-spacing:-.01em;line-height:1.4;max-width:38ch}
.prompt-sub{margin-top:14px;color:var(--faint);font-size:13px;font-family:"JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.p-choices{padding:8px 20px 10px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:720px;margin:0 auto;width:100%}
.p-choices.stack{grid-template-columns:1fr}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:16px 18px;font-size:15px;font-weight:600;line-height:1.35;transition:border-color .12s,background .12s,transform .06s;box-shadow:var(--shadow)}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.choice .idx{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;color:var(--muted)}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .idx{background:var(--good);color:#fff;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .idx{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice:disabled{cursor:default}
.choice.dim{opacity:.5}
.p-bottom{padding:6px 20px 22px;display:flex;justify-content:center}
.dunno{color:var(--faint);font-weight:700;font-size:14px;padding:10px 18px;border-radius:10px}
.dunno:hover{color:var(--muted);background:var(--panel)}
.dunno .mono{font-size:12px}

/* result */
.result{width:100%;max-width:560px;margin:auto;text-align:center;padding:20px}
.ring{width:150px;height:150px;margin:6px auto 18px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-size:38px;font-weight:900;font-family:"JetBrains Mono",monospace;letter-spacing:-.02em}
.ring .pct span{font-size:12px;color:var(--muted);font-weight:700}
.result h2{font-size:24px;margin-bottom:6px}
.result .tally{color:var(--muted);margin-bottom:22px}
.result .tally b{color:var(--ink)}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.review{text-align:left;border-top:1px solid var(--line);padding-top:18px}
.review h4{font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:700}
.rev-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px}
.rev-item .rq{font-weight:700;font-size:14px;margin-bottom:7px}
.rev-item .ra{font-size:13px;display:flex;gap:7px;align-items:baseline}
.rev-item .ra .tag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;flex:none;letter-spacing:.03em}
.tag.g{background:var(--good-soft);color:var(--good)}
.tag.r{background:var(--bad-soft);color:var(--bad)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){
  .p-choices{grid-template-columns:1fr}
  .card{padding:34px 20px}
  .section-head{margin-top:26px}
}
.hide{display:none!important}

/* ---------- quit confirm (inside player) ---------- */
.p-confirm{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb,var(--bg) 68%,transparent);backdrop-filter:blur(6px)}
.p-confirm-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:26px 24px;text-align:center}
.p-confirm-card h3{font-size:19px;margin-bottom:8px}
.p-confirm-card p{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 20px}
.p-confirm-card .row{display:flex;gap:10px}
.p-confirm-card .row .btn{flex:1;justify-content:center}

/* ---------- auth / sync ---------- */
.authbox{display:flex;align-items:center;gap:8px}
.authbox .acct-email{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth-off{font-size:11px;color:var(--faint);letter-spacing:.04em}
.dot-sync{width:8px;height:8px;border-radius:99px;flex:none;background:var(--faint);transition:background .2s}
.dot-sync.ok{background:var(--good)}
.dot-sync.busy{background:var(--star);animation:pulse 1s ease-in-out infinite}
.dot-sync.err{background:var(--bad)}
.dot-sync.off{background:var(--faint)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (max-width:600px){ .authbox .acct-email{max-width:92px} }
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap row">
    <div id="crumb"></div>
    <div class="spacer"></div>
    <div id="authBox" class="authbox"></div>
    <button class="icon-btn" id="themeBtn" title="테마 전환" aria-label="테마 전환">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div>

<main class="wrap" id="view"></main>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================
   amgiBBang (암기빵)  ·  single-file study quiz app
   data persisted to localStorage (this browser only)
========================================================= */
const LS_KEY = "amgi.db.v3";
const $ = (s,el=document)=>el.querySelector(s);
const uid = ()=> Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------------- seed content (from 도균's own files) ---------------- */
function seedDB(){
  const toeicWords = [
    ["scheme","계획, 제도"],["janitor","문지기, 관리인"],["appointment","약속, 예약"],
    ["responsible","~에 대한 책임이 있는"],["warehouse","창고"],["invoice","청구서, 송장"],
    ["refund","환불(하다)"],["merger","합병"],["tenant","세입자, 임차인"],
    ["itinerary","여행 일정표"],["reimburse","배상하다, 상환하다"],["vacancy","결원, 공석"],
    ["mandatory","의무적인, 필수의"],["prospective","장래의, 유망한"],["subsidiary","자회사"],
    ["prompt","신속한; 촉진하다"]
  ];
  const review = [
    ["The fan cowl doors are opened by:",["Hold open rods.","Spring actuators.","Load share grooves.","The PDOS."],3],
    ["The forward lower engine mount attaches to the engine's:",["Intermediate case.","Fan case.","Thrust reverser doors.","Exhaust case."],0],

/* ================= PARSERS ================= */
function parseCSV(text){
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"')q=true;
      else if(ch===","){row.push(cur);cur="";}
      else if(ch==="\t"){row.push(cur);cur="";}
      else if(ch==="\r"){}
      else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
      else cur+=ch; } }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
// vocab PASTE -> items. Split per line on the FIRST delimiter only, so that
// commas inside a Korean meaning ("문지기, 관리인") are preserved.
function parseVocabPaste(text){
  const items=[];
  text.split(/\r?\n/).forEach((line,idx)=>{
    line=line.replace(/\r/g,"").trim();
    if(!line) return;
    let word,mean;
    if(line.includes("\t")){ const i=line.indexOf("\t"); word=line.slice(0,i).trim(); mean=line.slice(i+1).replace(/\t/g,", ").trim(); }
    else { const i=line.indexOf(","); if(i<0) return; word=line.slice(0,i).trim(); mean=line.slice(i+1).trim(); }
    if(idx===0 && /^(단어|word|english|영어|표제어?)$/i.test(word) && /(뜻|meaning|의미|한글|kor)/i.test(mean)) return;
    if(word&&mean) items.push({q:word,a:mean});
  });
  return items;
}
// vocab rows (real grid: .xlsx cells or quoted CSV) -> items.
// col0 = word; meaning = remaining NON-EMPTY cells joined (drops trailing empty
// columns like "waive","뜻","","" and re-joins an unquoted meaning that got
// split across columns, e.g. janitor,문지기, 관리인).
function rowsToVocab(rows){
  if(!rows.length) return [];
  const first=(rows[0]||[]).map(c=>String(c==null?"":c).trim());
  const nonEmpty0=first.filter(c=>c!=="");
  const kwHeader = /단어|word|english|영어|표제|term/i.test(first[0]||"")
                 && /뜻|meaning|kor|한글|의미|definition|def/i.test(first[1]||"");
  // header like "T","D","P","E": every non-empty cell is a 1–3 letter ASCII token
  const codeHeader = nonEmpty0.length>=2 && nonEmpty0.every(c=>/^[A-Za-z]{1,3}$/.test(c));
  const start = (kwHeader||codeHeader) ? 1 : 0;
  const items=[];
  for(let i=start;i<rows.length;i++){
    const r=(rows[i]||[]).map(c=>String(c==null?"":c).trim());
    const w=r[0]; if(!w) continue;
    const m=r.slice(1).filter(c=>c!=="").join(", ").replace(/\s*,\s*$/,"").trim();
    if(w&&m) items.push({q:w,a:m});
  }
  return items;
}
// quiz rows (structured columns) -> items
function rowsToQuiz(rows){
  let start=0;
  const h=(rows[0]||[]).map(c=>String(c).trim().toLowerCase());
  const hasHeader = h.some(c=>/정답|answer|ans|해답/.test(c)) || /문제|question|지문/.test(h[0]||"");
  if(hasHeader) start=1;
  const items=[];
  for(let i=start;i<rows.length;i++){
    const r=(rows[i]||[]).map(c=>String(c==null?"":c).trim());
    if(!r.length) continue;
    const q=r[0]; if(!q) continue;
    // choices = columns 1..n-1 that are non-empty, last non-empty col is answer key
    const rest=r.slice(1).filter(c=>c!=="");
    if(rest.length<2) continue;
    const ansRaw=rest[rest.length-1];
    const choices=rest.slice(0,rest.length-1);
    let ans=resolveAnswer(ansRaw,choices);
    if(ans<0){ // maybe answer wasn't a separate col; skip
      continue;
    }
    items.push({q,choices,answer:ans});
  }
  return items;
}
function resolveAnswer(raw,choices){
  raw=String(raw).trim();
  let m=raw.match(/^([A-Ea-e])[.)]?$/); if(m){ const i="abcde".indexOf(m[1].toLowerCase()); if(i<choices.length)return i; }
  m=raw.match(/^([1-9])[.)]?$/); if(m){ const i=+m[1]-1; if(i>=0&&i<choices.length)return i; }
  // full-text match
  const norm=s=>String(s).replace(/[.\s]+$/,"").trim().toLowerCase();
  const idx=choices.findIndex(c=>norm(c)===norm(raw)); if(idx>=0)return idx;
  const idx2=choices.findIndex(c=>norm(c).includes(norm(raw))&&norm(raw).length>1); if(idx2>=0)return idx2;
  return -1;
}
// quiz from free numbered text (pasted from PDF/교안)
function textToQuiz(text){
  const lines=text.split(/\r?\n/);
  const items=[]; let cur=null; let pendingAns=null;
  const flush=()=>{ if(cur&&cur.choices.length>=2){
      if(cur.answer<0 && pendingAns) cur.answer=resolveAnswer(pendingAns,cur.choices);
      if(cur.answer<0) cur.answer=0;
      items.push(cur);
    } cur=null; pendingAns=null; };
  for(let raw of lines){
    const line=raw.replace(/ /g," ").trim();
    if(!line){ continue; }
    let m=line.match(/^정답\s*[:：]\s*(.+)$/i)||line.match(/^answer\s*[:：]\s*(.+)$/i);
    if(m){ pendingAns=m[1].trim(); continue; }
    // choice line: A. / A) / (A) / * A.
    m=line.match(/^(\*?)\s*\(?([A-Ea-e])\)?[.)]\s+(.*\S)\s*$/);
    if(m && cur){
      const star=m[1]==="*"; const txt=m[3].replace(/\s*\*\s*$/,"").trim();
      const starred = star || /\*$/.test(m[3].trim());
      cur.choices.push(txt);
      if(starred) cur.answer=cur.choices.length-1;
      continue;
    }
    // question line: "1." "1)" "12."
    m=line.match(/^\(?(\d{1,3})\)?[.)]\s+(.*\S)\s*$/);
    if(m){ flush(); cur={q:m[2].trim(),choices:[],answer:-1}; continue; }
    // continuation of question stem (no choices yet)
    if(cur && cur.choices.length===0){ cur.q+=" "+line; }
  }
  flush();
  return items;
}

/* ================= XLSX reader (no external lib) ================= */
async function inflateRaw(bytes){
  if(typeof DecompressionStream==="undefined") throw new Error("no DecompressionStream");
  const ds=new DecompressionStream("deflate-raw");
  const stream=new Response(new Blob([bytes]).stream().pipeThrough(ds));
  return new Uint8Array(await stream.arrayBuffer());
}
async function readXlsx(buf){
  const dv=new DataView(buf); const bytes=new Uint8Array(buf);
  // find End of Central Directory
  let eocd=-1;
  for(let i=bytes.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error("not a zip");
  const cdCount=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  const files={};
  for(let n=0;n<cdCount;n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true);
    const compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true);
    const extraLen=dv.getUint16(off+30,true);
    const commLen=dv.getUint16(off+32,true);
    const localOff=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(bytes.subarray(off+46,off+46+nameLen));
    files[name]={method,compSize,localOff};
    off+=46+nameLen+extraLen+commLen;
  }
  async function extract(name){
    const f=files[name]; if(!f)return null;
    const lh=f.localOff;
    if(dv.getUint32(lh,true)!==0x04034b50) return null;
    const nLen=dv.getUint16(lh+26,true); const eLen=dv.getUint16(lh+28,true);
    const dataStart=lh+30+nLen+eLen;
    const raw=bytes.subarray(dataStart,dataStart+f.compSize);
    const out = f.method===0? raw : await inflateRaw(raw);
    return new TextDecoder().decode(out);
  }
  // shared strings
  const shared=[]; const ssXml=await extract("xl/sharedStrings.xml");
  if(ssXml){
    const re=/<si>([\s\S]*?)<\/si>/g; let m;
    while((m=re.exec(ssXml))){
      const ts=[...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]);
      shared.push(unxml(ts.join("")));
    }
  }
  // first worksheet
  const wbXml=await extract("xl/workbook.xml");
  let sheetPath="xl/worksheets/sheet1.xml";
  // resolve first sheet via rels (best-effort; default is fine for most)
  const sheetXml=await extract(sheetPath) || await extract("xl/worksheets/sheet01.xml");
  if(!sheetXml) throw new Error("no sheet");
  const rows=[];
  const rowRe=/<row[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while((rm=rowRe.exec(sheetXml))){
    const cells=[]; const cRe=/<c([^>]*)>([\s\S]*?)<\/c>|<c([^>]*)\/>/g; let cm;
    while((cm=cRe.exec(rm[1]))){
      const attr=(cm[1]||cm[3]||""); const inner=cm[2]||"";
      const ref=(attr.match(/r="([A-Z]+)\d+"/)||[])[1];
      const type=(attr.match(/t="([^"]+)"/)||[])[1];
      let val="";
      const vM=inner.match(/<v[^>]*>([\s\S]*?)<\/v>/);
      const isM=inner.match(/<t[^>]*>([\s\S]*?)<\/t>/); // inline string
      if(type==="s" && vM){ val=shared[+vM[1]]||""; }
      else if(type==="inlineStr" && isM){ val=unxml(isM[1]); }
      else if(vM){ val=unxml(vM[1]); }
      const col=ref?colNum(ref):cells.length;
      cells[col]=val;
    }
    for(let i=0;i<cells.length;i++) if(cells[i]==null)cells[i]="";
    rows.push(cells);
  }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
function colNum(ref){ let n=0; for(const ch of ref){ n=n*26+(ch.charCodeAt(0)-64);} return n-1; }
function unxml(s){ return String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d)).replace(/&amp;/g,"&"); }

/* ================= QUIZ ENGINE ================= */
let Q=null;
function launchQuiz(deck){
  // build index list per mode
  let idxs = deck.items.map((_,i)=>i);
  if(startOpts.mode==="wrong") idxs=idxs.filter(i=>(deck.wrong||[]).includes(i));
  if(startOpts.mode==="fav")  idxs=idxs.filter(i=>(deck.fav||[]).includes(i));
  if(!idxs.length){ toast("해당 범위에 문항이 없어요"); return; }
  if(startOpts.shuffle) idxs=shuffle(idxs);
  Q={ deck, idxs, pos:0, correct:0, wrong:[], answered:false,
      dir:startOpts.dir, isV:deck.type==="vocab" };
  mountPlayer(); renderQuestion();
  document.addEventListener("keydown",keyHandler);
}
function mountPlayer(){

function quitQuiz(force){
  // ask before bailing mid-quiz (not on the result screen)
  if(force!==true && Q && Q.pos < Q.idxs.length){
    if(!document.getElementById("quitAsk")) showQuitConfirm();
    return;
  }
  document.removeEventListener("keydown",keyHandler);
  $("#modalHost").innerHTML=""; Q=null; render();
}
function showQuitConfirm(){

      <div class="row">

function renderQuestion(){
  const {deck,idxs,pos,isV,dir}=Q;
  const item=deck.items[idxs[pos]];
  Q.answered=false;
  $("#pgl").style.width=(pos/idxs.length*100)+"%";
  $("#pcount").innerHTML=`<b>${pos+1}</b> / ${idxs.length}`;
  // build prompt + choices
  let promptHTML, choices, correctIdx;
  if(isV){
    const askWord = dir==="qa"; // show word, ask meaning
    const prompt = askWord? item.q : item.a;
    const answer = askWord? item.a : item.q;
    // distractors from other items' (same field as answer)
    const pool = deck.items.map(it=> askWord? it.a : it.q).filter(x=>x!==answer);
    const distract = shuffle([...new Set(pool)]).slice(0,3);
    const opts = shuffle([answer,...distract]);
    correctIdx = opts.indexOf(answer);
    choices=opts;
    promptHTML=`<div class="prompt-word">${esc(prompt)}</div>
      <div class="prompt-sub">${askWord?"알맞은 뜻은?":"알맞은 단어는?"}</div>`;
  } else {
    const order = Q.shufChoices!==false ? shuffle(item.choices.map((c,i)=>i)) : item.choices.map((c,i)=>i);
    choices = order.map(i=>item.choices[i]);
    correctIdx = order.indexOf(item.answer);
    promptHTML=`<div class="prompt-q">${esc(item.q)}</div>`;
  }
  Q.correctIdx=correctIdx; Q.choicesShown=choices; Q.curOrigIdx=idxs[pos];
  const isFav=(deck.fav||[]).includes(idxs[pos]);
  const stack = choices.length>4 || choices.some(c=>c.length>46);
  const choiceHTML = choices.map((c,i)=>`
    <button class="choice" data-c="${i}">
      <span class="idx">${i+1}</span><span>${esc(c)}</span>
    </button>`).join("");
  $("#pmain").innerHTML=`
    <div class="p-stage">
      <div class="card fade">
        <button class="star ${isFav?'on':''}" id="starBtn" title="즐겨찾기" aria-label="즐겨찾기">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="${isFav?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.6 9.7l5.8-.8z"/></svg>
        </button>
        <span class="qtag">${isV?'VOCAB':'Q'+(pos+1)}</span>
        ${promptHTML}
      </div>
    </div>
    <div class="p-choices ${stack?'stack':''}" id="choices">${choiceHTML}</div>
    <div class="p-bottom"><button class="dunno" id="dunno">모르겠어요 <span class="mono">(9)</span></button></div>`;
  $("#choices").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b)answer(+b.dataset.c);});
  $("#dunno").onclick=()=>answer(-1);
  $("#starBtn").onclick=toggleFav;
}
function toggleFav(){
  const {deck,curOrigIdx}=Q; deck.fav=deck.fav||[];
  const i=deck.fav.indexOf(curOrigIdx);
  if(i>=0)deck.fav.splice(i,1); else deck.fav.push(curOrigIdx);
  save();
  $("#starBtn").classList.toggle("on", deck.fav.includes(curOrigIdx));
  const on=deck.fav.includes(curOrigIdx);
  $("#starBtn").querySelector("svg").setAttribute("fill",on?"currentColor":"none");
}
function answer(sel){
  if(Q.answered)return; Q.answered=true;
  const {deck,correctIdx,curOrigIdx}=Q;
  const btns=[...document.querySelectorAll("#choices .choice")];
  btns.forEach((b,i)=>{ b.disabled=true;
    if(i===correctIdx)b.classList.add("correct");
    else if(i===sel)b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const ok = sel===correctIdx;
  deck.wrong=deck.wrong||[];
  if(ok){ Q.correct++; const wi=deck.wrong.indexOf(curOrigIdx); if(wi>=0)deck.wrong.splice(wi,1); }
  else {
    Q.wrong.push({q:Q.isV?promptTextForReview():deck.items[curOrigIdx].q,
                  correct:Q.choicesShown[correctIdx],
                  chosen: sel>=0? Q.choicesShown[sel] : "(모르겠어요)"});
    if(!deck.wrong.includes(curOrigIdx))deck.wrong.push(curOrigIdx);
  }
  save();
  const delay = ok?620:900;
  setTimeout(next,delay);
}
function promptTextForReview(){
  const {deck,curOrigIdx,dir}=Q; const it=deck.items[curOrigIdx];
  return dir==="qa"? it.q : it.a;
}
function next(){ Q.pos++; if(Q.pos>=Q.idxs.length) finish(); else renderQuestion(); }
function keyHandler(e){
  if(!Q)return;
  if(e.key==="Escape"){ const qa=document.getElementById("quitAsk"); if(qa){qa.remove();} else quitQuiz(); return; }
  if(Q.answered)return;
  if(e.key>="1"&&e.key<="5"){ const i=+e.key-1; const b=document.querySelector(`#choices [data-c="${i}"]`); if(b)answer(i); }
  else if(e.key==="9") answer(-1);
  else if(e.key.toLowerCase()==="f"){ toggleFav(); }
}
function finish(){
  const {deck,idxs,correct,wrong}=Q;
  const total=idxs.length; const pct=Math.round(correct/total*100);
  if(startOpts.mode==="all"){ deck.best = deck.best==null? pct : Math.max(deck.best,pct); }
  save();
  $("#pgl").style.width="100%";
  const R=2*Math.PI*66; const dash=R*pct/100;
  const reviewHTML = wrong.length? `
    <div class="review">
      <h4>다시 볼 ${wrong.length}문항</h4>
      ${wrong.map(w=>`<div class="rev-item">
        <div class="rq">${esc(w.q)}</div>
        <div class="ra"><span class="tag g">정답</span><span>${esc(w.correct)}</span></div>
        <div class="ra" style="margin-top:4px"><span class="tag r">내 답</span><span style="color:var(--muted)">${esc(w.chosen)}</span></div>
      </div>`).join("")}
    </div>`:`<div class="review" style="text-align:center;color:var(--good);font-weight:700">🎉 전부 맞혔어요!</div>`;
  const msg = pct===100?"완벽해요!":pct>=80?"잘하고 있어요":pct>=50?"조금만 더!":"복습이 필요해요";
  $("#pmain").innerHTML=`<div class="p-stage" style="align-items:flex-start;overflow:auto;padding-top:26px">
    <div class="result fade">
      <div class="ring">
        <svg width="150" height="150"><circle cx="75" cy="75" r="66" fill="none" stroke="var(--line)" stroke-width="12"/>
        <circle cx="75" cy="75" r="66" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="${dash} ${R}"/></svg>
        <div class="pct"><b class="mono">${pct}%</b><span>정답률</span></div>
      </div>
      <h2>${msg}</h2>
      <div class="tally"><b class="mono">${correct}</b> 맞음 · <b class="mono">${total-correct}</b> 틀림 · 총 <b class="mono">${total}</b>문항</div>
      <div class="result-actions">
        ${wrong.length?`<button class="btn primary" id="retryWrong">오답 ${wrong.length}개 다시</button>`:``}
        <button class="btn" id="retryAll">전체 다시</button>
        <button class="btn ghost" id="toCat">세트 목록으로</button>
      </div>
      ${reviewHTML}
    </div></div>`;
  $("#retryAll").onclick=()=>{ startOpts.mode="all"; launchQuiz(deck); };
  const rw=$("#retryWrong"); if(rw)rw.onclick=()=>{ startOpts.mode="wrong"; launchQuiz(deck); };
  $("#toCat").onclick=quitQuiz;
  document.removeEventListener("keydown",keyHandler);
}

function openModal(html){
  const host=$("#modalHost");
  host.innerHTML=`<div class="scrim" id="scrim"><div class="modal fade" role="dialog" aria-modal="true">${html}</div></div>`;

}

   - strategy: pull-on-login + debounced "mirror" push

function uuid(){
  if(crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
    const r=Math.random()*16|0, v=c==="x"?r:(r&0x3|0x8); return v.toString(16);
  });
}

/* ---- debounced sync scheduler (called from save()) ---- */
function scheduleSync(){
  if(!syncReady) return;
  syncDirty=true;
  clearTimeout(syncT);
  syncT=setTimeout(runSync,1200);
}
async function runSync(){
  if(!syncReady||syncing) return;
  syncing=true; syncDirty=false;
  try{ await pushAll(); }catch(e){ console.warn("[sync] push failed",e); }
  syncing=false;
  if(syncDirty) scheduleSync(); // changes arrived mid-flight
}

/* ---- pull: rebuild in-memory DB from server rows ---- */
async function pullAll(){
  const q=t=>sb.from(t).select("*").order("sort",{ascending:true});
  const [cr,dr,ir]=await Promise.all([q("categories"),q("decks"),q("items")]);
  if(cr.error) throw cr.error; if(dr.error) throw dr.error; if(ir.error) throw ir.error;
  const cats=cr.data||[], decks=dr.data||[], items=ir.data||[];
  const out={cats:[]}, catById={}, deckById={};
  cats.forEach(c=>{ const cat={id:c.id,sid:c.id,name:c.name,emoji:c.emoji||"📚",decks:[]}; catById[c.id]=cat; out.cats.push(cat); });
  decks.forEach(d=>{
    const cat=catById[d.category_id]; if(!cat) return;
    const deck={id:d.id,sid:d.id,name:d.name,type:d.type,created:Date.parse(d.created_at)||Date.now(),
                items:[],fav:[],wrong:[],best:(d.best==null?null:d.best)};
    deckById[d.id]=deck; cat.decks.push(deck);
  });
  items.forEach(it=>{
    const deck=deckById[it.deck_id]; if(!deck) return;
    const idx=deck.items.length;
    const item={sid:it.id, q:it.q};
    if(it.a!=null) item.a=it.a;
    if(it.choices!=null) item.choices=it.choices;
    if(it.answer!=null) item.answer=it.answer;
    deck.items.push(item);
    if(it.fav) deck.fav.push(idx);
    if(it.wrong) deck.wrong.push(idx);
  });
  return out;
}

/* ---- push: mirror the whole DB up (upsert all + delete orphans) ---- */
async function pushAll(){
  if(!sb||!session||!session.user) return;
  syncState="busy"; renderAuth();
  const uidv=session.user.id;
  const cats=[], decks=[], items=[];
  DB.cats.forEach((c,ci)=>{
    if(!c.sid) c.sid=uuid();
    cats.push({id:c.sid,user_id:uidv,name:c.name,emoji:c.emoji||"📚",sort:ci});
    (c.decks||[]).forEach((d,di)=>{
      if(!d.sid) d.sid=uuid();
      decks.push({id:d.sid,user_id:uidv,category_id:c.sid,name:d.name,type:d.type,
                  best:(d.best==null?null:d.best),sort:di});
      const fav=new Set(d.fav||[]), wrong=new Set(d.wrong||[]);
      (d.items||[]).forEach((it,ii)=>{
        if(!it.sid) it.sid=uuid();
        items.push({id:it.sid,user_id:uidv,deck_id:d.sid,sort:ii,
          q:it.q, a:(it.a!=null?it.a:null),
          choices:(it.choices!=null?it.choices:null),
          answer:(it.answer!=null?it.answer:null),
          fav:fav.has(ii), wrong:wrong.has(ii)});
      });
    });
  });
  let err=null;
  const up=async(t,rows)=>{ if(!rows.length) return; const {error}=await sb.from(t).upsert(rows); if(error) throw error; };
  try{
    // parents first (FK), then children
    await up("categories",cats);
    await up("decks",decks);
    await up("items",items);
    // remove rows deleted locally — children first
    await delOrphans("items",items.map(x=>x.id));
    await delOrphans("decks",decks.map(x=>x.id));
    await delOrphans("categories",cats.map(x=>x.id));
    persistLocal(); // persist newly-assigned sids so reloads keep the mapping
    syncState="ok";
  }catch(e){ err=e; syncState="err"; }
  renderAuth();
  if(err) throw err;
}
async function delOrphans(t,keepIds){
  const keep=new Set(keepIds);
  const { data, error }=await sb.from(t).select("id");
  if(error) throw error;
  const gone=(data||[]).map(r=>r.id).filter(id=>!keep.has(id));
  for(let i=0;i<gone.length;i+=200){
    const { error:e2 }=await sb.from(t).delete().in("id",gone.slice(i,i+200));
    if(e2) throw e2;
  }
}

/* ---- session lifecycle ---- */
async function bootstrapSync(){
  try{
    syncState="busy"; renderAuth();
    const remote=await pullAll();
    if(remote.cats.length){
      // server has data -> it wins (online-first). replace local, cache it.
      DB=remote; persistLocal(); syncReady=true;
      syncState="ok"; renderAuth();
      go({view:"home",catId:null});
      toast("동기화됨 ✓");
    }else{
      // server empty -> one-time migrate the local data (seed or user's) up.
      const hadLocal=DB.cats.length>0;
      syncReady=true;
      await pushAll();
      toast(hadLocal? "기존 데이터를 계정에 업로드했어요 ✓" : "동기화 준비 완료 ✓");
      render();
    }
  }catch(e){
    console.warn("[sync] bootstrap failed",e);
    syncState="err"; renderAuth();
    toast("동기화 실패 — 오프라인 모드로 계속합니다");
  }
}

async function onSession(s){
  const was=session&&session.user? session.user.id : null;
  session=s;
  const now=s&&s.user? s.user.id : null;
  renderAuth();
  if(now && now!==was){
    // clean the magic-link tokens out of the URL
    if(location.hash.includes("access_token")) history.replaceState(null,"",location.pathname+location.search);
    await bootstrapSync();
  }else if(!now && was){
    syncReady=false; syncState="idle"; renderAuth();
    toast("로그아웃되었습니다");
  }
}

async function initSupabase(){
  try{
    const { createClient }=await import("https://esm.sh/@supabase/supabase-js@2");
    sb=createClient(SUPA_URL,SUPA_KEY,{ auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  }catch(e){
    console.warn("[supa] client failed to load — running local-only",e);
    sb=null; renderAuth(); return;
  }
  sb.auth.onAuthStateChange((_ev,s)=>{ onSession(s); });
  try{ const { data:{ session:s } }=await sb.auth.getSession(); await onSession(s); }
  catch(e){ console.warn("[supa] getSession failed",e); renderAuth(); }
}
